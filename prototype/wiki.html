<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: a field manual for the game. Sticky contents rail on the left, one long reference column on the right; every entry is built from the prototype's own data files, so sprites and numbers match the game. */
:root{
  --bg:#12141c; --panel:#1a1e2b; --panel-2:#232944; --line:#363e5e; --fg:#e4e0cf; --muted:#98a0ba; --accent:#e8b94a; --bad:#e8675f; --good:#78c474; --ground:#0b0d14;
  --display:"VT323","Courier New",monospace; --label:"Silkscreen","Courier New",monospace; --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eceef3; --panel:#ffffff; --panel-2:#f3f4f8; --line:#c9cedb; --fg:#191c27; --muted:#586079; --accent:#8f6300; --bad:#b8352b; --good:#2c7a33; --ground:#2a3044; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eceef3; --panel:#ffffff; --panel-2:#f3f4f8; --line:#c9cedb; --fg:#191c27; --muted:#586079; --accent:#8f6300; --bad:#b8352b; --good:#2c7a33; --ground:#2a3044; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:28px;color:var(--accent)}
h3{font-size:19px}
p{margin:0;max-width:68ch}
.lab{font-family:var(--label);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
canvas.spr{image-rendering:pixelated;display:block;flex:none}

.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
.rail{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:14px}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav a{font-family:var(--display);font-size:16px;color:var(--fg);text-decoration:none;padding:4px 8px;border-left:3px solid transparent}
.rail nav a:hover{border-left-color:var(--accent);color:var(--accent)}
.search{display:flex;flex-direction:column;gap:4px}
.search input{background:var(--panel);color:var(--fg);border:2px solid var(--line);padding:7px 9px;font:inherit;width:100%}
.search small{color:var(--muted);font-size:12px;min-height:1.5em}
main{display:flex;flex-direction:column;gap:44px;min-width:0}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static}
  .rail nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .rail nav a{border-left:0;border-bottom:3px solid transparent;white-space:nowrap}
}

.mast{display:flex;flex-direction:column;gap:10px;border-bottom:2px solid var(--line);padding-bottom:18px}
.mast h1{font-size:46px;letter-spacing:.03em;color:var(--accent);text-transform:uppercase}
.counts{display:flex;flex-wrap:wrap;gap:6px 18px}
.counts span{font-family:var(--label);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.counts b{font-family:var(--display);font-size:20px;color:var(--fg);margin-right:4px;letter-spacing:0}

section{display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.sub{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
td:first-child{white-space:nowrap}
.card{background:var(--panel);border:2px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .head{display:flex;gap:12px;align-items:center}
.card .head > div{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--label);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.hot{border-color:var(--bad);color:var(--bad)}
.chip.calm{border-color:var(--good);color:var(--good)}
.sw{display:inline-block;width:12px;height:12px;border:1px solid var(--line);vertical-align:-1px;margin-right:6px}
.stats{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:13px;color:var(--muted)}
.stats b{color:var(--fg);font-weight:700}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.rare{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:1px}

.scroll{overflow-x:auto;border:2px solid var(--line);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--label);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400;background:var(--panel-2);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

.mapwrap{background:var(--ground);border:2px solid var(--line);padding:6px}
.mapwrap canvas{width:100%;height:auto;max-width:100%;image-rendering:pixelated;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}

.trees{display:flex;flex-direction:column;gap:10px}
.treebox{overflow-x:auto;background:var(--panel);border:2px solid var(--line);padding:10px}
.tree{display:flex;align-items:center;gap:22px;width:max-content}
.tkids{display:flex;flex-direction:column;gap:8px;position:relative}
.tkids::before{content:"";position:absolute;left:-14px;top:12px;bottom:12px;border-left:2px solid var(--line)}
.tkids > .tree{position:relative}
.tkids > .tree::before{content:"";position:absolute;left:-14px;top:50%;width:12px;border-top:2px solid var(--line)}
.node{display:flex;gap:10px;align-items:center;background:var(--panel-2);border:1px solid var(--line);padding:6px 10px 6px 6px;min-width:230px}
.node b{font-family:var(--display);font-size:16px;font-weight:600}
.node small{display:block;font-size:12px;color:var(--muted)}
.vs{color:var(--accent);font-size:13px}
.callout{border-left:3px solid var(--accent);padding:4px 0 4px 12px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

    <p id="loading" class="muted">Loading game data…</p>

<script>
(()=>{
'use strict';
AUDIO.on=false;// (the wiki is silent: it loads the game's scripts, sound among them)
// a world to read from: owners, estates, stores and people as a new game starts (no game is started or saved)
P.x=(TOWNS[0].tx+.5)*TILE;P.y=(TOWNS[0].ty+2.5)*TILE;G.mode='wiki';initWorld();
const main=document.getElementById('wiki');
const L={grass:'Grassland',frost:'Frost',desert:'Desert',swamp:'Swamp',forest:'Forest',hills:'Hills',open:'Open ground',rock:'Hills or mountain',shore:'Shoreline'};
const pct=x=>Math.round(x*100)+'%';
// the kinds of holding (holdings.js), and their plurals
const HT=HOLDING_TYPES,HK=Object.keys(HT),kinds=k=>k==='city'?'cities':k+'s';
const keyOf=s=>Object.keys(ST).find(k=>ST[k]===s);
const kind=s=>s.big?'huge':s.range?'ranged':s.charge?'mounted':'melee';
const trainCostOf=id=>ST[id].tier>=3?45:25;
const g$=g=>GOODS[g]?GOODS[g].n:g;
const stats=s=>'<span>HP <b>'+s.hp+'</b></span><span>DMG <b>'+(+(s.dmg||0).toFixed(1))+'</b></span><span>SPD <b>'+s.spd+'</b></span>'+
  (s.range?'<span>Range <b>'+s.range+'</b></span>':'<span>Reach <b>'+(s.reach||0)+'</b></span>')+'<span>Every <b>'+(s.cd||0).toFixed(2)+'s</b></span>'+(keyOf(s)?'<span>Power <b>'+rating([keyOf(s)])+'</b></span>':'');
const spr=(type,team,scale)=>'<span data-spr="'+type+'" data-team="'+(team||0)+'" data-scale="'+(scale||3)+'"></span>';
const fac=f=>f==='player'?'<span class="sw" style="background:'+FACS.player.col+'"></span>You':'<span class="sw" style="background:'+FACS[f].col+'"></span>'+FACS[f].n;
const table=(head,rows,num)=>'<div class="scroll"><table><thead><tr>'+head.map((h,i)=>'<th'+((num||[]).includes(i)?' class="n"':'')+'>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr class="entry">'+r.map((c,i)=>'<td'+((num||[]).includes(i)?' class="n"':'')+'>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
const kv=pairs=>'<dl class="kv">'+pairs.map(([k,v])=>'<dt>'+k+'</dt><dd>'+v+'</dd>').join('')+'</dl>';
const sub=(title,lead,html)=>'<div class="sub"><h3>'+title+'</h3>'+(lead?'<p class="muted">'+lead+'</p>':'')+html+'</div>';
const callout=t=>'<p class="callout">'+t+'</p>';
const sections=[];
function section(id,title,lead,html){sections.push([id,title]);main.insertAdjacentHTML('beforeend','<section id="'+id+'" aria-labelledby="h-'+id+'"><h2 id="h-'+id+'">'+title+'</h2>'+(lead?'<p class="muted">'+lead+'</p>':'')+html+'</section>')}
const hireAt=id=>{const s=ST[id];if(!s.race||!HIRE[id])return[];const r=RACES[s.race];
  return TOWNS.filter(t=>t.races.includes(s.race)&&t.hires(s.race).includes(id)).map(t=>t.name)};
const statText=m=>Object.keys(m||{}).filter(k=>GEAR_STAT[k]&&m[k]).map(k=>{const [n,u]=GEAR_STAT[k],v=u?Math.round(m[k]*100):m[k];return (v>0?'+':'')+v+u+' '+n}).join(', ')||'—';

/* counts */
const raceUnits=Object.keys(ST).filter(k=>ST[k].race).length,mercs=['militia','spearman','archer','ranger','horse'];
document.getElementById('counts').innerHTML=[[MW+'×'+MH,'tiles'],[TOWNS.length,'holdings'],[FIDS.length,'realms'],[Object.keys(RACES).length,'races'],[raceUnits+mercs.length,'troop types'],[Object.keys(MONSTERS).length,'monsters'],
  [Object.keys(GOODS).length,'goods'],[Object.keys(ESTATES).length,'estates'],[Object.keys(ITEMS).length,'items'],[Object.keys(TREE).length,'skill nodes']].map(([n,l])=>'<span><b>'+n+'</b>'+l+'</span>').join('');
document.getElementById('loading').remove();

/* getting started */
section('start','Getting started','Pick a race and a past, then make your name: hire troops, trade between towns, clear camps and lairs, take jobs, and in time take holdings of your own.',
  kv([['World map','Click to move (or click a holding, party or site to walk to it and meet it). Space pauses; 1×, 2× and 3× set the speed.'],['Screens','C character · K skills · I inventory · Esc closes the window in front, one at a time; with none left it opens the pause menu (save, load, settings, main menu).'],
    ['Towns','The town panel is the quick way to trade, recruit and take jobs. <b>Walk the streets</b> to go in on foot: WASD or click to walk, E to talk. The '+Object.values(SCENE_ROLES).filter(R=>R.tab).map(R=>R.n.toLowerCase()).join(', ')+' each open their part of the panel; the priest blesses you once a day (+'+BLESSING.morale+' morale); townsfolk share gossip. Walk out of the gate to leave. Castles, villages and sites get their own scenes later.'],
    ['Battle','You command, your hero fights: select with a click or a box, right-click to move or attack, right-drag to lay out a line; your hero strikes, dodges and uses the skills in their slots on their own (no keys).'],
    ['Troops','G picks a group (infantry, archers, cavalry, all) · H hold · C run · V walk (the pace) · B shield wall · L loose · T wedge · right-drag lays out the line (width and depth).'],['Saving','Seven saves: the Autosave (the game saves itself each day and when you leave a town), the Quick save (F6 or the Save button, any time) and five slots of your own (Esc, then Save game: pick a slot; one in use asks a second click to overwrite). Continue loads the latest; Load game lists them all, each with its day, your hero and when it was saved, and deletes one with two clicks.'],['Guide texts','The hints at the top of the screen and the helper lines in towns and battle; Settings turns them off.'],
    ['Spoils','After a fight its gold, XP and prisoners are yours at once; the things it won lie on the ground beside your bag. Click one to take it, use <b>Take all that fits</b>, or click something in your bag to put it back and make room. Whatever you leave stays behind (Esc won’t leave it for you).']])+
  callout('A day on the map lasts '+DAY_SECONDS+' seconds at 1× speed: '+pct(NIGHT_AT)+' daylight, then dusk, night and dawn. Your band eats and is paid each day.'));

/* world */
section('world','The world','Ashmark is a '+MW+' × '+MH+' tile map: cold north, hot south, ranges you cross by passes, roads between the holdings and bridges where they cross water. Colors show each realm’s land as a new game begins.',
  '<div class="mapwrap"><canvas id="worldmap" role="img" aria-label="Map of Ashmark with its holdings and the lands each realm rules"></canvas></div>'+
  '<div class="legend">'+FIDS.map(f=>'<span>'+fac(f)+'</span>').join('')+CLIMS.map(c=>'<span><span class="sw" style="background:'+PAL[c].g[0]+'"></span>'+L[c]+'</span>').join('')+'</div>'+
  sub('Territory','Every holding rules the land it can reach from its gates; roads carry its reach farther, forest, hills and mountains less, and water stops it. Where two claims meet, the holding with more reach to spare keeps the land.',
    table(['Kind','Starting reach','Grows to (in peace)'],HK.map(k=>[k,HT[k].reach,HT[k].reach+HT[k].growMax+' (+ up to 3 for friendly holdings within 50 tiles)']),[1])+
    callout('Reach grows about 1 every '+Math.round(1/GROW_DAY)+' days a holding is held in peace, and by 1 each time you clear a camp or den near it. Conquest costs 2; siege, sack and raids wear it down. A captured holding brings all its land to the new owner. Crossing into another realm’s land shows in the log.')));

/* biomes */
const biomeRows=[
  ['Grassland','grass',T_OPEN,'Normal vision','—','Open ground: cavalry rides 15% faster.'],
  ['Forest','grass',T_FOREST,'70% vision. Parties hiding in forest are seen late, and you are too.','—','Trees block movement and stop about 25% of arrows. Elves shoot through them.'],
  ['Hills','grass',T_HILL,'130% vision','—','High ground: archers reach 15% farther.'],
  ['Mountains','grass',T_MOUNT,'—','Impassable. Dragon lairs.','—'],
  ['Frost','frost',T_OPEN,'Normal vision','Carry 1 fur per 5 people or lose 3 morale a night; the cold eats extra food.','Snow slows everyone 15%, except dwarves and wolves.'],
  ['Desert','desert',T_OPEN,'120% vision','−3 morale a night unless within 3 tiles of water.','Heat makes melee attacks 10% slower, except for orcs and scorpions.'],
  ['Swamp','swamp',T_OPEN,'80% vision','Fever chance each night: 25%, minus 3% per Medicine level. Costs morale and can kill a troop.','Mud slows everyone 20% and cavalry 35%, so charges stall. Orcs wade through.'],
  ['Road','grass',T_ROAD,'Normal vision','—','—']];
const ignores=(c,t)=>Object.keys(RACES).filter(r=>RACES[r].home.includes(t===T_FOREST?'forest':t===T_HILL?'hills':c)).map(r=>RACES[r].n).join(', ')||'—';
section('biomes','Biomes','Every tile has a climate and a terrain. Speed multiplies the two (minimum 35%), and roads always run at 130%. Camping within 3 tiles of a holding avoids every nightly cost.',
  table(['Biome','Speed','Vision','Each night','In battle','Ignored by'],biomeRows.map(([n,c,t,v,night,battle])=>{const sp=t===T_ROAD?1.3:t===T_MOUNT?0:Math.max(.35,SPEEDMUL[t]*CLIMMUL[c]);
    return ['<span class="sw" style="background:'+(t===T_FOREST?PAL.grass.mini[1]:t===T_HILL?PAL.grass.hill[1]:t===T_MOUNT?'#7d8494':t===T_ROAD?PAL.grass.road[0]:PAL[c].g[0])+'"></span><b>'+n+'</b>',sp?pct(sp):'—',v,night,battle,t===T_ROAD||t===T_MOUNT?'—':ignores(c,t)]}),[1])+
  callout('Your race skips the travel and survival cost of its home biomes. Some mounts ignore a biome too (see Mounts).'));

/* races */
section('races','Races','Pick one at the start. It sets your bonuses, your hero’s look and which biomes slow you down. Troops of your own race cost 15% less to hire.',
  '<div class="grid">'+Object.keys(RACES).map(r=>{const R=RACES[r];return '<article class="card entry"><div class="head">'+spr(R.melee,0,3)+spr(R.horse,0,2)+'<div><h3>'+R.n+'</h3><span class="muted">'+R.d+'</span></div></div>'+
    kv([['Home',R.home.map(h=>L[h]).join(', ')],['Recruits',[R.melee,R.ranged,R.horse].map(k=>ST[k].n).join(', ')],['Livestock',(LIVESTOCK[r]||[]).map(id=>CRITTERS[id].n).join(', ')],['Lives in',TOWNS.filter(t=>t.races.includes(r)).map(t=>t.name).join(', ')]])+'</article>'}).join('')+'</div>');

/* realms */
section('realms','Realms and diplomacy','Five realms declare wars, sign truces and form alliances on their own. Their lords lead armies of up to '+LCAP+' (more when a realm is losing) to besiege enemy holdings. A realm that loses its last holding falls.',
  '<div class="grid">'+FIDS.map(f=>{const F=FACS[f],own=TOWNS.filter(t=>HOME[t.name]===f);return '<article class="card entry"><h3>'+fac(f)+'</h3><p class="muted">'+F.d+'</p>'+
    kv([['Lords',F.lords.join(', ')],['Holdings',own.map(t=>t.name+' <span class="muted">('+t.kind+')</span>').join(', ')],['Peoples',[...new Set(own.flatMap(t=>t.races))].map(r=>RACES[r].n).join(', ')],['Starting land',landsOf(f)+' tiles']])+'</article>'}).join('')+'</div>'+
  sub('Realm economy (Settings)','How strictly armies depend on their realm’s money and food.',table(['Mode','What it means'],Object.keys(ECON_MODES).map(m=>['<b>'+ECON_MODES[m][0]+'</b>'+(m==='full'?' (default)':''),ECON_MODES[m][1]])))+
  callout('Sign a mercenary contract in any town tavern: the realm pays 1 gold per troop a day and adds a 40 gold bounty per enemy lord you beat. Their enemies become yours. Attacking a lord, a caravan or a holding makes its realm hostile for a while and costs honor with it.'));

/* holdings */
section('holdings','Holdings',TOWNS.length+' cities, towns, castles and villages. Hiring needs standing at the holding: '+REP_NEED[1]+' for tier 1, '+REP_NEED[2]+' for tier 2, '+REP_NEED[3]+' for tier 3. Standing is your reputation there, half your honor with its owner, and a bonus where your own race lives. Shown as a new game begins.',
  table(['Holding','Kind','Starts with','Folk','Climate','Walls','People','Estates','Notes'],TOWNS.map(t=>['<b>'+t.name+'</b>',t.kind,fac(HOME[t.name]),t.races.map(r=>RACES[r].n).join(', '),L[t.clim],WALL_N[wallOf(t)],t.pop,'<span class="muted" style="font-size:13px">'+estateLine(t)+'</span>',
    '<span class="muted" style="font-size:13px">'+t.note+(Object.keys(COMPS).some(c=>COMPS[c].town===t.name)?' Companion: '+Object.keys(COMPS).filter(c=>COMPS[c].town===t.name).map(c=>COMPS[c].n).join(', ')+'.':'')+'</span>']),[6])+
  sub('Staying in a holding','Stay here (in a holding’s window, or Lodgings in its tavern) and your band goes inside while the days pass at whatever speed you set.',kv([
    ['Inside','Off the map: nothing hunts you, the frost and the desert cannot reach you. You recover four times as fast as on the road, morale rises 15 a day, the wounded heal twice as fast. Click the holding to trade, hire and drink as usual; the banner’s Leave takes you out by the gate.'],
    ['Free','Where they know you: your own fief, your employer’s holdings, or standing '+STAY_FREE+' or more. As long as you like.'],
    ['Paid','Elsewhere '+STAY_BASE+' gold a day, and 1 more for every 2 of your people, paid as each day begins; the banner says the day your gold runs out, and then the innkeeper sends you out.'],
    ['Refused','By a hostile realm, where they dislike you (standing below 0), in a siege or in ruins, and by a castle that does not know you: castles take no paying guests.'],
    ['Food','Your band eats its own stores; the tavern sells Provisions for 3 or 7 days.'],
    ['A siege','If an army lays siege while you are inside, time stops and you choose: defend the walls (fight the besieger, the garrison beside you), slip out (a flight past them), or wait it out (if it falls, you are thrown out and lose a quarter of your soldiers).'],
    ['Everyone shelters','Lords rest only in their own realm’s holdings. Order a companion’s party to Stay in town and it shelters in the nearest holding that will take it, by your rules, paid from your purse, hiring there.']])));

/* economy */
const resWhere=g=>{const ore=!!ORE_W[g],n=DEPOSITS.filter(d=>d.g===g).length,c=ore?ORE_W[g].clim:FISH_W[g],cl=Object.keys(c).filter(k=>c[k]>0).sort((a,b)=>c[b]-c[a]);return (ore?'Mines':'Ports')+' near its '+n+' '+(ore?'veins':'fishing grounds')+' ('+cl.join(', ')+'), '+RES_RATE[g]+'/lv'};
const madeBy=g=>GOODS[g].res||ORE_W[g]?resWhere(g):Object.keys(MAKE).filter(k=>MAKE[k].out&&MAKE[k].out[g]).map(k=>ESTATES[k].n+' '+MAKE[k].out[g]+'/lv').concat(g==='furs'?['Weavers & Tanners in the frost']:[]).concat(['grain','timber','stone'].includes(g)?['the land itself']:[]).join(', ')||'—';
const usedBy=g=>[...Object.keys(MAKE).filter(k=>MAKE[k].in&&MAKE[k].in[g]).map(k=>ESTATES[k].n),...HK.filter(k=>HT[k].needs[g]).map(kinds),...(GOODS[g].food?['everyone (food)']:[]),
  ...(Object.keys(ESTATES).some(k=>ESTATE_MAT(k,1)[g])||WALL_MAT.some(m=>m&&m[g])?['building']:[]),...(GOODS[g].ammo?['your bows and crossbows']:[]),...(FORGE.some(m=>m[g])?['smiths, forging gear']:[]),...HK.filter(k=>HT[k].wants[g]).map(k=>kinds(k)+' (wanted)'),...(g==='furs'?['frost holdings, your band in the frost']:[])].join(', ')||'—';
section('economy','The economy','Every holding keeps real stores. Each day its estates (staffed by its people) and its land produce, workshops turn inputs into goods, people and garrison eat and use things up, and fresh food spoils. What is left sets the price.',
  table(['Good','Base','Per bag slot','Spoils a day','Made by','Used by'],Object.keys(GOODS).map(g=>['<b>'+g$(g)+'</b>',GOODS[g].base+'g',GOODS[g].stack,GOODS[g].spoil?pct(GOODS[g].spoil):'—','<span class="muted" style="font-size:13px">'+madeBy(g)+'</span>','<span class="muted" style="font-size:13px">'+usedBy(g)+'</span>']),[1,2,3])+
  sub('Prices','A holding aims to keep ten days of what it needs. Price = base × √(target ÷ stock), between 0.4× and 3×, and 40% more while it lies ruined. Every unit you buy or sell changes the stock, so the next unit costs more (or pays less). Buying costs about 8% over the price and selling pays about 8% under it; Trade narrows the gap. You cannot buy what a market does not have, and buying a hungry town’s food angers its people.','')+
  sub('Kinds of holding','',table(['Kind','How many','Garrison','Walls (start / best)','Patrol','Its window','Raises'],HK.map(k=>[k,TOWNS.filter(t=>t.kind===k).length,HT[k].gar,WALL_N[HT[k].wall0]+' / '+WALL_N[HT[k].wallMax],HT[k].patrol.size,HT[k].tabs.join(', '),HT[k].hires.join(', ')]),[1,2,4])+'<p class="muted">Each realm rules from one city. Villages are the most common holding; castles are its garrisons, which keep a stockpile instead of a market and lodge only those they know.</p>')+
  sub('People and prosperity','',table(['Kind','Starts with','Room for','Storage per good'],HK.map(k=>[k,HT[k].pop0+' people',HT[k].popCap+' + land/12 (+15% per Granary)',HT[k].store+' (+50% per Granary)']),[1])+
    kv([['Food','People eat '+HT.town.needs.food+' food per 100 a day, the garrison 1 per 4 soldiers. Perishables go first; three or more kinds of food lift spirits.'],['Other needs','Towns use cloth, timber, tools, ale, spice and some iron; castles iron, tools and ammunition; villages a little cloth, timber, tools and ale.'],
      ['Famine','Short of food, people die or leave (up to 3% a day).'],['Growth','Fed and content (prosperity over 40%), a holding grows toward its room.'],['Prosperity','Follows how well needs are met; turmoil, ruin, sieges and high taxes wear it down.'],
      ['Staffing','Each estate level needs '+WORKERS+' workers; with too few people, estates make less.'],['Volunteers','Grow each day with people and prosperity, up to a tenth of the people. Every troop you hire takes one.']]))+
  sub('Taxes','A day’s taxes = people × rate × (0.4 + prosperity) + 3 gold per Market level. Your fiefs pay you; the rest pay their realm.',table(['Rate','Share','Effect on prosperity'],TAX_N.map((n,i)=>[n,pct(TAX_RATE[i]),['+1 a day','—','−1.5 a day'][i]])))+
  sub('Caravans','Realms ship surplus (stock well above ten days’ need) to the friendly holding most short of it, within 90 tiles. The goods leave one store and arrive in the other, and the receiving owner takes a 5% toll. Guards fight off small bands of bandits; big bands plunder the carts, and lords at war seize them for their own realm. Meet a caravan to buy its cargo or sell it what its destination lacks — or attack it.',
    kv([['Your caravans','Hire one in a fief’s Fief tab: pick a destination, up to two goods from the fief’s stores, the guards and whether it runs a standing route.'],['Delivering','To one of your fiefs it unloads into the stores. Anywhere else it sells at that market (moving its prices) and brings the gold home.'],
      ['Cost',PCV.hire+' gold plus '+PCV.guard+' per guard to hire; '+PCV.upkeep+' gold a day plus '+PCV.guardUp+' per guard. Up to '+PCV.max+' at once.'],['On the road','Click one of yours to end or start its standing route, or disband it and take its cargo.']]))+
  sub('Realm treasuries','Realms collect taxes and tolls, and pay '+0.6+' gold a day per soldier in the field and 0.4 per garrison soldier, 10 gold (and 1 food) per recruit, 6 per garrison soldier raised, 90 to raise a new army, and gold plus materials for every building. Armies eat from their holdings’ stores. In Full mode a broke or starving realm loses soldiers to desertion and grows weary of war. Character → Factions shows each treasury.',''));

/* estates */
const makeText=k=>{const M=MAKE[k];if(!M.out)return '—';return (M.in?Object.keys(M.in).map(g=>M.in[g]+' '+g$(g).toLowerCase()).join(' + ')+' → ':'')+Object.keys(M.out).map(g=>M.out[g]+' '+g$(g).toLowerCase()).join(', ')};
section('estates','Estates and walls','What a holding has built. Every building stands on its own tiles of the map grid, round the holding’s centre (a keep, a citadel or a hall): houses and workshops, and outside them the estates that work the land, their workers walking out each morning and home at dusk. In your fiefs you place what you build: a ghost of it follows the pointer, green where it may stand, red where not. One project at a time, and it takes days (fewer with more people), going up behind scaffolding. Realms build their own over time.',
  table(['Estate','Needs','Per level a day','Gold for level 1 / 2 / 3','Materials (level 1)','Notes'],Object.keys(ESTATES).map(k=>{const E=ESTATES[k];return ['<b>'+E.n+'</b>',E.ground?L[E.ground]:'inside',makeText(k),[1,2,3].map(l=>bldCost(k,l)).join(' / '),matsText(ESTATE_MAT(k,1)),'<span class="muted" style="font-size:13px">'+E.d+'</span>']}))+
  callout('Most estates reach level '+HT.town.estMax+' in towns and cities and '+HT.village.estMax+' in villages and castles. Level 1 takes '+buildDays(1)+' days, level 2 '+buildDays(2)+' and level 3 '+buildDays(3)+' at a holding of its usual size (a busier one builds up to twice as fast, a small one slower); materials scale with the level and come from the holding’s own stores. Each level shows a better building. Raids burn one estate and sacks burn two: they stand in ruins until rebuilt. Some need others first: '+Object.keys(ESTATE_NEEDS).map(k=>ESTATES[k].n+' needs '+needsText(k)).join('; ')+'. You can pull down your own buildings for half their cost back.')+
  sub('Houses and people','',kv([['Room','Each house gives room for people (a cottage '+HOUSING.cottage+', a town house '+HOUSING.townhouse+', a yurt '+HOUSING.yurt+', a tree house '+HOUSING.treehouse+'), and so does the centre. A holding grows only to the room it has.'],['Full','A full holding grows no more, and now and then some of its people leave for a holding with room to spare.'],['Building','A house costs '+HOUSE_COST.gold+' gold and '+matsText(HOUSE_COST.mats)+'. Realms build houses as their people fill them; in your fiefs you place them yourself.']]))+
  sub('Walls','',table(['Walls','Gold','Materials','Days','Defenders fight as'],WALL_N.map((n,l)=>[n,l?WALL_COST[l]:'—',l?matsText(WALL_MAT[l]):'—',l?buildDays(l):'—','level '+(1+l)]))+
    kv([['Starting walls',HK.map(k=>cap1(kinds(k))+' '+WALL_N[HT[k].wall0].toLowerCase()).join(', ')+'. Villages can build up to a '+WALL_N[HT.village.wallMax].toLowerCase()+'.'],['Effects','Each level makes lords’ sieges last a day longer and lets your fief hold 3 more garrison soldiers.'],['Breach','Capturing a holding costs it a wall level. Realms fortify their frontier first.'],['On the map','A holding’s walls are its centre’s fortification: Fortify upgrades the keep, citadel or hall itself. A hall gains a palisade; a keep or citadel stands open, then behind a palisade with wooden towers, then stone walls, then great walls with more towers.']])));

/* warfare */
section('warfare','Sieges, raids and fiefs','Any holding not yours or your employer’s can be attacked from its Besiege tab or by walking up to it while its realm is hostile to you.',
  kv([['Siege camp','Needs 5 troops. Ladders are ready after '+LADDER_DAYS+' days (then you can assault); a ram after '+RAM_DAYS+' weakens the walls one level.'],['Starving','The garrison and people inside live on the holding’s stores; when food runs out the garrison starves, and a garrison of one surrenders.'],
    ['Relief','The realm sends its lords to break your siege. Walking away lifts it.'],['No walls','Any holding without walls (a village that never built them, or a castle whose walls were breached) needs no siege: fight its garrison in battle to seize it, or raid it (takes half a day; you carry off food and gold, burn an estate, and kill or scatter people). Holdings with walls (a palisade or better, the centre’s fortification) must be besieged first.'],['Estates','Plunder an estate’s stores, burn it a level down, or sabotage it: slip in (likelier at night, with Scouting and Agility) and it makes nothing for some days; caught, you fight its guards.'],['Castle stores','A castle has no market but keeps a stockpile. In a castle of yours, store goods there and take them out again.'],
    ['Captured','Take it in peace (+3 honor with the other realms), sack it (gold and goods; reputation and honor fall, half its stores and a third of its people are lost, two estates burn), sack and leave, or hand it to your employer for gold.'],
    ['Your fiefs','Pay taxes daily. Garrison them from the Fief tab (hire guards or station troops), set the tax rate, store and take goods, build estates and walls, and send caravans. Realms hostile to you will come for them.'],
    ['Lords’ sieges','Last 2 days plus the wall level; well-walled and well-stocked holdings hold better.']]));

/* combat */
const famN={one:'Sword (and any other one-handed weapon)',dagger:'Dagger',dual:'Dual wield',axe:'One-handed axe',heavy:'Greatsword and other two-handed blades',hammer:'Warhammer and clubs',thrust:'Spear held in two hands',phalanx:'Spear and shield'};
const shapeN={arc:'sweep',thrust:'thrust (pierces)',twin:'twin thrust',slam:'slam',spin:'spin'};
section('combat','Battle','Battles are fought in real time on ground shaped by the biome, under RTS command: you select your groups and send them, and everyone, your hero too, fights on their own. Your hero swings the combos below, draws and looses the bow and uses the skills in their slots when the moment is right (healing when hurt, a Whirlwind or Earthquake when hemmed in, a Leap or Dash to close in, Fireball and Rain of Arrows on a knot of enemies, War Cry and Banner when the troops are engaged). Lords, chieftains and your companions fight with the same mind as your hero: the combo of their weapon, paid with stamina, a breath after each finisher, the skills their tree has given them, and the special moves. A Shield Bash (with a shield) when it matters, at a heavy hitter, a big beast or another side’s character in front, or with two or more pressing, every '+CHAR_AI.bash+' s; a Shove (with a bow) at a foe who reaches them, every '+CHAR_AI.shove+' s, both only while not Tired; a Dodge Roll away when under '+Math.round(CHAR_AI.low*100)+'% health and hemmed in, unhurt while rolling. They keep '+CHAR_AI.keepSp+' stamina back for their blows. A character who sees one of the other side’s near ('+CHAR_AI.duel+' px) goes for them, unless on the move elsewhere: their lord for your hero, your companions for their lord. The enemy has a captain too: their infantry advances in line and charges when close, their archers hold behind it (shooting at your hero once the lines meet), and their cavalry swings round a flank and falls on your archers.',
  sub('Weapon combos','Keep attacking inside '+COMBO_WINDOW+'s of the last blow to chain the next step. Each step’s shape is both its hitbox and its look: a sweep covers a wide arc at your reach, a thrust a long narrow line that pierces everyone along it (each one behind takes a little less), a slam a patch of ground ahead, a spin all around.',
    table(['Weapon','Step 1','Step 2','Finisher','Stamina'],Object.keys(COMBOS).map(k=>{const C=COMBOS[k];return ['<b>'+famN[k]+'</b>',...C.map(c=>c.n+' <span class="muted">· '+shapeN[c.shape]+' · ×'+c.mult+(c.stun?' · stuns':'')+'</span>'),STAM.swing.map(v=>Math.round(v*(C.sp||1))).join(' / ')]})))+
  sub('Moves','The moves of the manual control, set aside for now under RTS command (the bow and the skills your hero uses on their own):',kv([['Dodge','F rolls you out of harm (invulnerable while rolling): '+STAM.dodge+' stamina, every '+DODGE_CD+'s.'],['Block','Hold B to raise your guard: blows from the front lose most of their damage, and blocking costs stamina.'],
    ['Shove','Right-click pushes enemies in front back and staggers them for '+SHOVE.stun+'s ('+SHOVE.sp+' stamina). With a shield it is a Shield Bash: ×'+BASH.mult+' damage, '+BASH.stun+'s stagger.'],['Sprint','Hold Shift to run 60% faster for stamina.'],
    ['Bows','Hold to draw: a longer draw flies faster and hits harder, but holding a full draw drains stamina. The wheel sets the range; arrows fly in an arc (less at short range). The Hawkeye node shows the arrow’s path. Crossbows shoot flat and hit harder; they need bolts.'],
    ['Magic','Staves and wands cast bolts that splash, paid in mana. Spells get stronger with Spellcraft.'],['Ammunition','Your arrows and bolts come from your bag; troops carry a quiver (at least '+AMMO.min+': bows and slings '+AMMO.bow+', crossbows '+AMMO.xbow+') and draw blades when it runs out. After a won battle you gather some back.']]))+
  sub('Skills','Learn active skills on the skill tree and put them in the ten skill slots on the Skill bar page: your hero uses what is slotted, when the moment is right (battles are commanded, so skills have no keys). The Skill bar lists only what you have learned. Apart from the tree’s paths are the special skills: the basic moves everyone has (Dodge Roll; Shove with a bow; Shield Bash with a shield) and the combo, which grows with practice in your weapon’s discipline: two blows to begin with, a third at '+COMBO_UP.third+', and at '+COMBO_UP.fin+' you choose its finishing style once: Stunning (a long stun, a small push) or Crushing (a hard push, no stun).',table(['Skill','Learned at','Cooldown','Mana','Stamina','Does'],Object.keys(HSKILLS).map(k=>{const S=HSKILLS[k],N=TREE[S.learn];return ['<b>'+S.n+'</b>',N?N.n+' <span class="muted">('+(N.br?TREE_BRANCHES.find(b=>b.k===N.br)?TREE_BRANCHES.find(b=>b.k===N.br).n:N.br:'—')+')</span>':'—',S.cd+'s',S.mp||'—',S.sp||'—',S.d]}),[2,3,4]))+
  sub('Formations','A group’s shape is the line you drag: right-click and drag to set where it runs, how wide it is and which way it faces. Wide makes a long thin line, short makes a deep block or a column (a plain right-click keeps its width and turns it toward where it marches). Its formation is how the men stand in that shape: a line, or one of these for the troops it suits (press its key or button again for line; Shield wall is a separate B ability: eligible shield infantry need a nearby supporting shield within 16 pixels, facing the same direction, for 35% less frontal damage and 40% slower movement. Isolated shields retain personal blocking only; charging or running lowers the wall). A block '+DEPTH.ranks+' or more ranks deep takes only '+Math.round(DEPTH.charge*100)+'% of a charge’s bonus (not from behind); each unit card shows its shape (wide × deep).',table(['Formation','Key','For','What it does'],FORM_ORDER.map(f=>['<b>'+FORMS[f].n+'</b>',FORMS[f].key||'—',FORMS[f].who?WHO_N[FORMS[f].who]:'everyone',FORMS[f].d])))+
  sub('Facing, morale and routs','Every soldier faces somewhere: its formation’s front while it stands in its slot, else where it marches or whom it fights. A blow from the flank hurts '+Math.round((FLANK.flank-1)*100)+'% more, from behind '+Math.round((FLANK.rear-1)*100)+'% (arrows half that). Morale belongs to the <b>whole formation</b>, not to each soldier: every member reads the same value (the blue line on a unit card), and the unit wavers, breaks, routs and rallies together. Wounds, deaths, flank blows and charges on any member feed it, measured against the unit’s <b>starting</b> size and health, so ten losses from a hundred shake a big unit as much as one from ten shakes a small one. Losses also lower the ceiling it can recover to. Losses in a short burst add a fading <b>recent-loss</b> strain (up to −'+GROUP_RESOLVE.strainCap+', easing over about '+LOSS_MEMORY.life+' combat seconds). Missile damage it cannot answer (it deals back less than '+Math.round(GROUP_RESOLVE.answer*100)+'% of what it takes) drains up to '+GROUP_RESOLVE.missileRate+' a second. It comes back when the fighting leaves it alone, faster near your hero (or their lord). Under '+MORALE.waver+' it wavers; at zero or less it starts <b>Breaking</b>: after '+RESOLVE.breakDelay+' combat seconds the whole unit routs (morale '+RESOLVE.severeAt+' or lower shortens that to '+RESOLVE.severeDelay+'; just after its leader falls, '+RESOLVE.leaderDelay+'). Positive morale cancels breaking. A routing unit ignores your orders; its soldiers run for their own edge of the field, or a flank if the enemy cuts them off (see Field size and ways off), and leave the field there alive. Left alone it can rally once (back on Hold); the second time it breaks for good. When a side has no one left fighting, the battle ends in a rout. A beaten enemy army (under '+Math.round(FOE_CMD.beaten*100)+'% of your strength, its units’ morale under '+FOE_CMD.broken+') falls back as one, withdrawing off its edge rather than dying to the last man; those who get away are not kills. Commanders (the enemy’s, your allies’ and your own army’s under AI command) also mind each unit: a foot unit whose morale drops under '+UNIT_AI.pullAt+' steps back to recover while a steadier one moves into the gap, shaken cavalry (under '+UNIT_AI.chargeAt+') stand off for up to '+UNIT_AI.cavRecover+' seconds instead of charging again, and riders and archers go for a wavering unit first.Your hero, companions, lords, chieftains and beasts never break; tournaments have no morale.',
    table(['What','Unit morale'],[['Wounds','−'+GROUP_RESOLVE.hurt+' × the share of the unit’s starting health taken'],['A member falls','−'+GROUP_RESOLVE.death+' × the share of its starting men (plus fading recent-loss strain)'],['A comrade unit loses a man close by','a small share of −'+MORALE.death],['A blow from the flank / rear','−'+MORALE.flank+' / −'+MORALE.rear+' shared across the unit (once per '+RESOLVE.flankEvery+' s per soldier)'],['A charge hits it','up to −'+CHARGE.shock+' (riders), −'+CHARGE.footShock+' (on foot), shared across the unit'],['Its leader falls','−'+MORALE.lead+' to every unit of that side'],['A neighbour routs','−'+MORALE.cascade+' within '+GROUP_RESOLVE.routeRadius+' px (at most once per '+CONFIDENCE.cascadeCooldown+' s)'],['Unanswered missiles','up to −'+GROUP_RESOLVE.missileRate+' a second'],['Outmatched','up to −'+AWARENESS.outmatched+' a second from visible stronger opposition'],['Locally overwhelmed','up to −'+AWARENESS.overwhelmed+' a second from close fighting strength or threats on opposite sides'],['Cohesion','up to '+Math.round(COHESION.resist*100)+'% less ordinary shock and '+Math.round(COHESION.cascade*100)+'% less routing shock'],['An enemy falls close by','+'+RESOLVE.killGain+' (at most +'+RESOLVE.killCap+' a second)'],['A war cry','+'+MORALE.cry+' to each unit it reaches'],['No enemy close by','+'+MORALE.back+' a second, back to its ceiling']]))+
  sub('Local confidence','A unit judges visible, distance-weighted fighting strength within '+CONFIDENCE.radius+' pixels of its left, centre and right. Health, damage, attack rate, tier and large creatures count; trees and rocks can block the view; routing or withdrawing allies give no reassurance. Confidence needs a real visible advantage, so equal armies are never both confident. It begins above '+CONFIDENCE.ratio+':1 and is full at '+CONFIDENCE.full+':1: up to +'+CONFIDENCE.max+' morale above the start (never above 100), recovering at up to '+CONFIDENCE.recover+' a second, with '+Math.round(CONFIDENCE.resist*100)+'% less ordinary shock. Unanswered missile fire, a withdrawal order, a nearby rout (for '+CONFIDENCE.panic+' s) and a fallen leader (for '+CONFIDENCE.leaderPause+' s) remove it. Confidence is not immunity: a unit with sustained zero morale still breaks. Cohesion comes from aligned, settled neighbours within '+COHESION.radius+' pixels and covered flanks. The same rules apply to both armies; Army depleted is informational only.','')+
  sub('Unit icons','Over each group on the field, as in Total War: a small square icon in its side’s colour (yours blue, theirs red) showing what the unit is, by its most common soldier (sword, spear, axe, hammer, bow, crossbow, javelin, staff for casters, horse for riders, a paw for beasts, a crown for your hero), and a thin bar under it for its health (green, then yellow under 60%, red under 30%). The icon is edged gold while you have it selected, blinks orange while it wavers and fades while it runs. Beside it, a round badge for each thing wrong with it; nothing when all is well. The details show the same badges. Each icon stays over its own unit, gliding after it; icons may overlap, the selected one on top, then the one you point at, then yours over theirs (one underneath a little faded). Only when overlapping icons belong to units fighting each other hand to hand do they ease apart, side by side, and back together once the fight is over. An icon is clicked as its unit: click to select it (click again on the same spot for the one underneath), right-click an enemy’s to attack it, right-click one of yours to send the selection to where it stands.',
    table(['Badge','Means'],['wavering','routing','shattered'].map(k=>[badgeSVG(k,21),'<b>'+MORALE_STATE[k].n+'</b>'+({wavering:': morale under 30, or most of them',routing:': most of them running',shattered:': all running, broken for good'})[k]]).concat([[badgeSVG('confident',21),CONFIDENCE_LABEL]],Object.keys(WEAK_N).map(k=>[badgeSVG(k,21),WEAK_N[k]]))))+
  sub('Battle cards','The cards along the bottom of a battle, one for each of your units (and All), show no words: its key, its soldiers’ picture, how many, its shape (wide × deep) and formation, its health, morale and stamina bars, and up to '+CARD.show+' small icons for what it is doing, the most pressing first: its morale failing, its order, its pace while it moves, an ability in use, out of ammunition or exhausted, its flags, a companion falling back, low on ammunition or tired, hidden or in woods, confident, then what weakens it. The All card shows the troops icon and your whole number, with how many of them run or break. Point at a card or an icon for the words (a long press on a phone); the card’s tooltip lists all of them, those with no room on it too. Every icon is the same round badge, its rim the colour of its kind: an order gold, the pace pale grey, an ability in use green, a warning amber (low on ammunition, tired, falling back), something bad red (out of ammunition, exhausted), a flag steel blue, being hidden or in woods teal; morale and what weakens a unit keep their own colours.',
    table(['Icon','Means'],[[badgeSVG('move',21),'Moving to a place you sent it (no icon while it just holds)'],[badgeSVG('attack',21),'Attacking a unit you set it on'],[badgeSVG('charge',21),'Charging (their commander’s order)'],[badgeSVG('advance',21),'Advancing'],[badgeSVG('withdraw',21),'Withdrawing'],
      [badgeSVG('walk',21)+' '+badgeSVG('run',21),'At a walk, at a run (while it moves)'],[['brace','spur','fire','rally','standfast'].map(k=>badgeSVG(k,21)).join(' '),'An ability in use: Brace, Spur, Fire arrows, Rally; standing fast (Stand Fast!)'],
      [badgeSVG('noammo',21)+' '+badgeSVG('ammo',21),'Out of ammunition; low (under '+Math.round(CARD.low*100)+'%)'],[badgeSVG('spent',21)+' '+badgeSVG('tired',21),'Exhausted; tired'],
      [['shieldWall','firm','cease','skirmish','melee'].map(k=>badgeSVG(k,21)).join(' '),'Shield wall, holding their ground, cease fire, skirmishing, melee mode'],[badgeSVG('fallback',21),'A companion or your hero falling back out of the press'],
      [badgeSVG('hidden',21)+' '+badgeSVG('woods',21),'Hidden from the enemy; in woods'],[badgeSVG('routing',21),'Morale badges, as over the units (above); on the All card with how many']]))+
  sub('Charges','A charge builds momentum as it runs at the enemy: full after '+CHARGE.run+' px. Its first blow hits up to '+Math.round(CHARGE.cav*100)+'% harder for riders ('+Math.round(CHARGE.foot*100)+'% on foot), knocks the one it hits back and shakes it; then the run is spent. Spearmen facing a charge, while still fighting, brace against it (no bonus); a charge into their flank or rear hits home (Brace covers the flanks too); a wedge charges harder and a deep formation blunts it.','')+
  sub('The field and its effects','The battle is fought where you can see it: the strips under the top bar and under your orders and unit cards are dimmed and closed, a line marks the edge, and rocks and trees keep room to pass between them and it. A soldier who cannot get at his foe for the men already round him turns on another close by who has room; one who cannot get past a rock or the edge steps aside to go round. If no blow is struck anywhere for '+FOE_CMD.lull+' seconds, the enemy sends every group in. Every blow shows: sparks off steel, dust off a heavy blow, a flash where it lands, blood that falls and splashes the grass (Blood in Settings turns it off); a cavalry charge strikes home with a shockwave of dust and a moment of slow motion; the dead fall and lie where they fell, their weapons dropped beside them, in a pool of blood that spreads (riders thrown from mounts that lie on their side; a troll topples, a spider ends on its back, a slime runs flat; the undead and slimes do not bleed); knocked-back men drag dust; spells trail embers and burst in light. Running feet kick up dust the colour of the ground (riders a cloud); arrows stay where they land, in the ground or in a man (into a shield from the front with splinters). Each skill has its look: Whirlwind a swirl of blades, Leap Slam an afterimage and cracks where it lands, Earthquake cracks, dust and debris, Blade Dash afterimages, War Cry rings of sound and golden sparks over the troops it fires up, War Banner a golden ring, Fireball an explosion of fire, embers and smoke, Frost Nova a ring of ice, shards and frost on the ground, Healing Light green sparkles rising from all it heals. Every fighter holds his weapon as he would: a sword hangs point down at rest, rides the shoulder on the march, is raised up and back in a charge, comes up in guard near a foe and is swung in one smooth arc; a spear or a pike stands upright at rest, is levelled in a charge, pointed at the foe close by and thrust; a lance is couched. Running men lean into a long stride, and mounts gallop. The other armies are commanded as yours: the enemy’s captain, and your allies’ own (the lords who come to your side: their icons a paler blue, not yours to order), use the same groups, pace and formations you do. They walk unless they charge, break off when they move a group elsewhere, and choose their formation for the moment: a wedge to charge with cavalry, a shield wall for shielded infantry under arrows, loose order for archers being shot at.','')+
  sub('Field size and ways off','A battle is fought on a field of one of five sizes, by how many fight in it: small (under '+FIELD_SIZES.heads[0]+' soldiers), big (under '+FIELD_SIZES.heads[1]+'), large (under '+FIELD_SIZES.heads[2]+'), very large (under '+FIELD_SIZES.heads[3]+') or huge. Open plains make it a size bigger; forest, a mountain pass or a swamp a size smaller; holding a bridge or an ambush keeps it middling. The battle\u2019s first line names it. Each side deploys with open ground behind it, more on bigger fields; the camera starts with the whole field in view (scroll in and out, drag to pan). Any open stretch of any edge is a way off the field, marked with a faint strip: not deep water, rock or cliffs. A unit that withdraws or routs runs for its own side’s edge, the way it came. Only when it cannot get there (a river, rock, cliffs) or the enemy cuts it off (standing across the way, or nearer home than they are) does it run for a flank or the far edge, whichever is safest. Riders who get round behind a line can make it flee sideways, for them and for you. Those who get away are not lost, whichever edge they took.','')+
  sub('Terrain','Fields fought on the world map have their own ground, the same each time you fight in that place: hills in up to three terraces, woods and marsh (an oasis in the desert beside water). High ground lets shooters reach '+Math.round(HILL.range*100)+'% farther per level and hits '+Math.round(HILL.melee*100)+'% harder in melee; a charge downhill hits harder and uphill softer; climbing is slow and tiring (dwarves climb freely). Woods slow riders and big beasts, stop some arrows, hide units from sight and break shield walls and wedges (elves move freely). Marsh slows everyone and tires them (orcs wade through). Beside water a river runs down the field. Deep water cannot be crossed: only the fords (shallow, slowing everyone but orcs and breaking shield walls and wedges) and bridges (open ground but narrow, so a column files over) lead across. Some hills are ringed by sheer cliffs and climbed only by their ramps, where the cliff breaks and the hillside slopes down; on others men can drop down the cliffs but climb up only by one ramp. Mountains and rock spires bar the way and hide whatever stands behind them. Soldiers find their own way round all of these, and a charge that has to go round a cliff gathers no speed until its way is clear. Arrows fly over cliffs. In the frost the river is frozen and can be crossed anywhere. Trees and the cliffs of high ground stand in front of or behind soldiers by where they stand; those hiding your own men turn see-through. Woods hide soldiers: one in a wood is unseen until one of yours comes within about 64 px (96 from higher ground) or he attacks, and he stays seen for 3 seconds after striking. High ground blocks sight too: a rise higher than both sides hides whoever is behind it. The enemy is bound by the same sight as you. Hidden enemies are not shown, cannot be clicked and are not shot at; an attack on a group that disappears goes to where it was last seen. A group that charges out of hiding springs an ambush: its first charge shakes the enemy half again as hard. There are no scattered trees or rocks on such fields. The field looks like the land around it, with several layouts for each kind of place: open plains with a few copses or a low rise; rolling hills, ridges and cliffs; mountain passes among the peaks; fens with dry islands and marsh pools in the swamp; dunes and rock spires in the desert; snowy copses and frozen rivers in the frost. A forest is a real forest: woods cover '+Math.round(TERRAIN_DENSE_LAYOUT.stands.wood[0]*100)+'–'+Math.round(TERRAIN_DENSE_LAYOUT.deepwood.wood[1]*100)+'% of the field, each army starts in a glade of its own, and a road (where the map has one), a deer path or a chain of clearings runs through. Near the elves’ towns the woods are older, and in the swamp they stand in the marsh. The neighbouring land shapes the edges: a forest to the north brings woods along the north edge, hills a ridge, peaks crags, and water reed marsh; what lies west or east shapes both ends alike, so neither army is favoured. A road on the map crosses the field the way a real road runs: round the hills where it can, up one only by a slope or a ramp (never over a cliff), over a river at its bridge or ford; men march a little faster on it. A road is a worn cart track with faint wheel ruts and a path a trodden trail (snowy in the frost, sandy in the desert, muddy in the swamp); across marsh a road runs on a log-edged causeway and a path on a boardwalk. Both sides always get a like share of cover and of open ground, measured where each army deploys, at every size of field.','')+
  sub('Battle types','Only on fields with their own ground; the same rules bind the enemy.',kv([['Hold the bridge','A fight on a road bridge or beside one (not where the river is ice, nor in the desert): a river nobody can wade, one bridge near the middle of the field and, at '+Math.round(BTYPE.ford*100)+'% of such places, a ford far off it. The side set upon (you, unless you rode at them) stands on its bank by the bridge; the other comes on from its own edge and must cross. Holding it, you deploy anywhere on your bank. The enemy holding it keeps its bank and never follows you over the water; taking it, it shoots first, gathers at the crossing least held, goes over and forms up before it attacks.'],
    ['Ambush','Bands, and hostile lords’ armies, that come at you where there is cover may spring one: on '+Math.round(BTYPE_WORLD.cover.forest*100)+'% of days in a forest, '+Math.round(BTYPE_WORLD.cover.hills*100)+'% in hills, '+Math.round(BTYPE_WORLD.cover.field*100)+'% where the field has woods or rock (raiders more, lords’ armies less). Your band is caught in march order on a road down the middle, with no deployment and no fleeing; they wait hidden in woods (in the desert, behind low ridges) on one flank or both, and their first charge out of hiding lands half again as hard. A road event can lead into one too.'],
    ['Spring an ambush','Riding at a band, an army, a patrol or a caravan where there is cover, choose Spring an ambush: your band waits hidden beside the road while theirs marches along it in column, and you charge out when you choose.']]))+
  sub('Fog of war','In a field battle each side sees only what its own soldiers can: footmen about '+FOG.foot+' px, shooters '+FOG.shoot+', riders '+FOG.mounted+', your hero, companions and leaders '+FOG.char+'. They see '+Math.round(FOG.high*100)+'% farther for each level they stand above what they look at, and big beasts are seen from half again as far. Hills and rock block the line of sight, and woods still hide whoever stands in them until you come close. Ground out of your army’s sight is shaded and the enemy there is not shown, on the field or on the small map, from your deployment on; where an enemy unit was last seen a grey marker stays, fading over '+FOG.ghost+' seconds, and an attack on it goes to that place. A unit that strikes or shoots is seen for 3 seconds. The enemy commander is bound by the same sight: when he has seen nothing of you, he sends his army forward to look. The top bar still counts both armies. Settings → Fog of war (battle) turns it off; sieges, raids and tournaments have none.','')+
  sub('Who decides','A soldier only acts: he keeps his place, and by himself attacks the nearest foe in his reach (in his arc first). Every decision is yours, or the AI commander’s for its own groups (the enemy, your allies, your army on auto): whom to focus (it sets its shooters on a melee foe coming at them, then a man they can finish, one fighting its men, their shooters, a character, the nearer the better), when to stop and shoot, when its shooters skirmish (Kite: only from a foe who fights hand to hand coming at them that none of its men cover: one on him or between; keeping away comes before any focus), its characters’ duels and skills, and when to send its shooters hunting (Hunt: with nobody in their reach and the armies apart, it sends them out at a walk to a spot of their own, '+Math.round(HUNT.spot*100)+'% of their reach from a mark (their shooters ours outrange, a man alone, a slow one), only where every foe who fights hand to hand is '+HUNT.safe+' s away by his own speed, a free rider '+HUNT.ride+' s, and no shooter of theirs outranges them; home at a run the moment that is no longer so, the mark is gone, their ammunition runs low or the armies close. Keeping away (Kite) comes first). Your hero and companions use their skills and special moves on their own only with Auto skills on (K, the Skills button).','')+
  sub('Race fighting styles','Every commander fights in its people’s way, set by most of its army. Dwarves hold the line: they wait for you with their crossbows, lock shields against a charge early and rotate a shaken unit out of the line. Elves keep their distance: their archers lead and hunt, their infantry waits behind them and their riders swing wide. Orcs come on in a frenzy: they attack sooner, charge from further off, never pull a unit back until it is nearly broken and fight on long after a human army would fall back. A mixed host goes for whoever wavers. Men are balanced. The battle log names the enemy’s style as the fight begins.','')+
  sub('Range and line of fire','Melee fighters strike all round them. Shooters shoot only into a fan in front of them ('+Math.round(SHOOT.arc*57.3)+'°), turning to bring a foe into it first (half a turn in about a second); mages (their bolt: their spells keep their own shapes) and riders shoot all round. The moment a foe is in range and in their fan, and they are not told to cease fire, they draw (their aim time), loose and reload (their reload time); the two make up their attack time, split by weapon: a bow '+SHOOT.kinds.bow.map(x=>Math.round(x*100)+'%').join(' / ')+', a crossbow '+SHOOT.kinds.xbow.map(x=>Math.round(x*100)+'%').join(' / ')+' (quick to aim, slow to span), a sling '+SHOOT.kinds.sling.map(x=>Math.round(x*100)+'%').join(' / ')+', magic '+SHOOT.kinds.magic.map(x=>Math.round(x*100)+'%').join(' / ')+'. You see them draw, loose and reload. Shooters must stand still to shoot, but for those with Shoots on the move: every elf with a bow, rangers, mounted archers and wolf archers. A move, a stagger or a rout lets a draw down. Attacking comes before moving: a commander whose shooters, on their way, have a foe in their reach stops them there, and they turn to him and shoot; a hunt with someone in reach ends where it stands (your own groups do what you order). A captain whose shooters are threatened calls off their march and has them stand where they are. Select a group with shooters (or point at its icon) and its reach shows on the ground: one shaded area of their fans, each man’s own range, its edge drawn. Point at an enemy and a line of fire runs from each such group: green when all can reach them, amber when some (or some must turn first), red when none, with how many; a crossbow, sling or bolt whose straight line crosses trees says so (trees stop flat shots; arrows arc over). With nothing selected, point at an enemy group of shooters to see their reach, in red.','')+
  sub('Damage types and armour','Every blow, shot and spell is physical (slash, pierce, blunt) or magical (fire, frost, arcane). A troop’s type comes from its weapon (swords and axes slash; spears, lances, javelins, bows and crossbows pierce; hammers and slings crush), a caster’s from its school, a beast’s from its claws, fangs or bulk; a character’s from the weapon they carry, and in a combo a thrust pierces and a slam crushes. Physical damage is stopped in part by armour; magic ignores armour, and a ward stops '+Math.round((1-WARD)*100)+'% of it.',table(['Damage','Unarmoured','Leather','Mail','Plate','Hide / scales'],Object.keys(ARMOR_VS).map(k=>[DMG[k].n,...Object.keys(ARMOR).map(a=>'×'+ARMOR_VS[k][a])]))+'<p>An armour-piercing weapon (longbows, crossbows, dwarf axes and hammers, javelins, some lances) is stopped half as much. A troop’s armour comes from what it wears (cloth: unarmoured; leather and furs; mail; plate for heavy troops; hides and scales for beasts); a character’s from their body armour (wooden and bronze: leather, iron and silver: mail, gold and finer: plate). Some creatures fear or shrug off a school: a troll takes '+Math.round((RESIST.troll.fire-1)*100)+'% more from fire and '+Math.round((1-RESIST.troll.frost)*100)+'% less from frost, a frost wolf '+Math.round((1-RESIST.wolf.frost)*100)+'% less from frost, a dragon '+Math.round((1-RESIST.dragon.fire)*100)+'% less from fire; elves resist arcane, dwarves fire, orcs frost a little. Magic damage shows in violet. Unit cards show each unit’s damage type and armour.</p>')+
  sub('Accuracy','Every shot strays a little from where it is aimed, by the same rule for all: a bow’s up to ±'+(AIM.bow[0]/2*57.3).toFixed(1)+'° to the side and '+Math.round(AIM.bow[1]*100)+'% long or short, a crossbow, sling or bolt of magic ±'+(AIM.flat[0]/2*57.3).toFixed(1)+'° (it flies flat, so never short). Elves stray half as much. A soldier is steadier by his kind’s tier ('+Math.round(AIM.tier*100)+'% a tier); your hero, a lord, a chieftain or a companion by their skill (Archery; Spellcraft for magic, '+Math.round(AIM.skill*100)+'% a level) and by their weapon’s quality ('+Math.round(AIM.gear*100)+'% a tier). Tired, shots stray '+Math.round((AIM.tired-1)*100)+'% more; spent, '+Math.round((AIM.spent-1)*100)+'% more. Every character draws a bow the same way: a fuller draw flies farther, faster and harder, and one loosed early strays more (up to '+Math.round(AIM.draw*100)+'%).','')+
  sub('Stamina','Every soldier has stamina ('+FATIGUE.max+'); your hero pays the same out of their own SP, and a lord, a chieftain or a companion out of theirs, by the same rules: it comes back only as a soldier’s does (faster with the talents that quicken it). A blow in a hero’s combo costs what a soldier’s does (the finisher more); a skill its stamina cost. Mana does not come back in battle but with the talents for it, nor health but by a skill, a talent or gear that heals (Healing Light, Field Surgeon, Troll Hide, a troll’s own regeneration). A charge spends up to '+FATIGUE.charge+' at its impact (by how far it ran); running costs '+FATIGUE.run+' a second, charging twice that; each blow costs '+FATIGUE.blow+'. Walking, or fighting where they stand, neither spends nor restores it; standing out of the fight restores '+FATIGUE.rest+' a second. Under '+FATIGUE.tired+' a unit is Tired: '+Math.round((1-tiredMul({sta:FATIGUE.tired-1}).spd)*100)+'% slower, '+Math.round((1-tiredMul({sta:FATIGUE.tired-1}).dmg)*100)+'% weaker, and its charge builds half as fast. Under '+FATIGUE.spent+' it is spent: '+Math.round((1-tiredMul({sta:0}).spd)*100)+'% slower, '+Math.round((1-tiredMul({sta:0}).dmg)*100)+'% weaker, and it cannot charge. Hardier units (Vigor, on their unit card) spend it slower and get it back faster. Its card and details show a stamina bar, and its icon a Tired badge; rest a unit before you charge again.','')+
  sub('Unit abilities','Some groups have a special order with a cooldown, shown at the end of the order bar when you select them; press it (or its key) to use it for every selected group that can. A group has an ability when at least half its fighting troops qualify. Durations and cooldowns run on battle time, so pausing stops them: a lit button shows the seconds left, a shaded one the seconds until it is ready, and its tooltip says why one is unavailable.',
    table(['Ability','Key','Who','What it does','Lasts','Cooldown'],UNIT_ABIL_ORDER.map(id=>{const A=UNIT_ABILITIES[id];return['<b>'+A.n+'</b>',A.key,({brace:'Spear and pike infantry',fire:'Bow and crossbow archers',spur:'Cavalry',rally:'Foot units'})[id]||'—',A.d||'',A.dur?A.dur+' s':'at once',A.cd+' s']})))+
  sub('Commander powers','Your hero commands the army as a whole, apart from the units’ own abilities and the hero’s skills: a commander bar down the left of the field (keys Z, S, O). Your hero must be alive and on the field; Rally the Line and Stand Fast! reach your units with a soldier within the command radius ('+COMMAND_POWERS.radius+' px, +'+Math.round(COMMAND_POWERS.lead*100)+'% a level of Leadership, at most +'+Math.round(COMMAND_POWERS.leadMax*100)+'%; point at the button to see it). Leadership also shortens the cooldowns ('+Math.round(COMMAND_POWERS.cdLead*100)+'% a level, to '+Math.round(COMMAND_POWERS.cdMin*100)+'%). An enemy lord or chieftain has the same powers, and uses them; so does your army under the AI (A). Using a power is no order: a companion falling back keeps falling back.',
    table(['Power','Key','What it does','Cooldown'],POWER_ORDER.map(id=>{const A=COMMAND_POWERS[id];return['<b>'+A.n+'</b>',A.key,A.d,A.cd?A.cd+' s':'once a battle']})))+
  sub('Battle feedback','The big moments get a short banner at the top of the field, in the colour of the side they concern: a unit routs, is shattered, rallies or is flanked; a leader falls; the enemy falls back. Your units’ routs and a leader’s fall also go to the battle log. A rider or a great beast charging home shakes the view a little (not if your system asks for reduced motion). After the battle, the report names your <b>unit of the battle</b>: the one with the most kills (then the most damage dealt).','')+
  sub('Touch controls','On a phone or tablet held sideways.',kv([['Battle','Tap a unit to select it; tap again to send it there, or onto the enemy you tap. Hold a finger still for about half a second (a ring fills; red over an enemy) to move there or attack. Hold, then drag, to lay out the line: where, how wide, facing which way. Drag without holding to box several units. Pinch to zoom; move two fingers to pan.'],['Map','Tap to travel. Hold on a holding, party or site to see what it is; the next tap puts the card away.']]))+
  sub('Troop orders','',kv([['Select','Click a unit (or the icon over it) to select its group, drag a box round several, or their card at the bottom (mages are a group of their own, a step behind the infantry). Keys 1–9 and 0 select the ten cards.'],['Move and attack','Right-click the ground to send the selection there in formation; right-click an enemy to set them on it. Your groups walk (slower, the formation kept) unless told to run: a double right-click makes that order a run, and on an enemy a charge, the only way a charge builds (walking in, it does not). Charge (C) runs too; R switches a group between walking and running. A move breaks them off the fight they are in: they turn and go to their new places, striking no one on the way (and taking blows in the back from whoever they leave), and fight again once there. H (Hold) is no move: in a fight, they keep fighting.'],['Order paths','A dashed line with chevrons shows where your selected groups are going: round cliffs, rock and deep water, then their queued waypoints; an attack runs to the enemy, or to where he was last seen. Point at a card or icon to see that group’s path. Settings → Order paths: always, selected only or off.'],['Marching','Shift + right-click adds waypoints, taken in turn; a double right-click sends them at a run. R: walk (at the slowest one’s pace, keeping formation; no running charge) or run.'],['More orders','W withdraw: they run, striking no one, for your own edge of the field, or a flank if the enemy cuts them off (the blue line shows where) and leave the battle there, alive; any the enemy cuts down on the way are lost. Withdraw everyone and once all have reached it the battle is over: your retreat, with its summary (what you slew, what it cost), and the enemy loses your trail for a while. If your hero is down, the band carries them off when the last of it gets away · F hold their ground (strike only what comes into reach) · Q cease fire (shooters shoot whatever comes into range unless told to cease; ceasing, only at the enemy you set them on) · E skirmish (shooters keep their distance: a foe who fights hand to hand coming inside '+Math.round(SKIRM.keep*100)+'% of their range, they back away from him, facing him, till he is at '+Math.round(SKIRM.until*100)+'% of it, then shoot again; only those who shoot on the move loose while backing) · X Melee Mode, shooters only (on: a shooter puts his bow away and fights hand to hand, with a short sword, whoever reaches him, within '+BLADE.reach+' px, with a sidearm at '+Math.round(BLADE.dmg*100)+'% of his shot, then shoots again; off: he keeps shooting, point blank).'],['Selecting more','Shift + click or drag adds to the selection; Ctrl + 1–9/0 stores a selection; that key recalls it. Unassigned keys select the matching card.'],['Groups','Up to '+ARMY_LIMIT+' independent homogeneous groups per army, including hero and companions. Duplicate types are allowed; select each card separately or All.'],['Orders','H hold where they stand · C run · V walk (the pace only; a double right-click on an enemy charges him) · B shield wall ability · formations: L loose (spacing only) · T wedge (6 formed cavalry: +5% charge, capped +30% at 16) · right-drag to lay out the line, its width and depth.'],
    ['Troop blows','Spearmen thrust and carry on into the enemy behind for half damage; chieftains, trolls and the heaviest hitters chop down from above and cleave a neighbor; the rest mostly swing. Spears facing a charge brace against it (not from the flank or rear, unless braced); cavalry charges hit 1.9× at full speed.']])));

/* troops */
const node=id=>{const s=ST[id],at=hireAt(id);return '<div class="node entry">'+spr(id,0,3)+'<div><b>'+s.n+'</b><small>Tier '+s.tier+' · '+kind(s)+(HIRE[id]?' · hire '+HIRE[id]+'g':' · train '+trainCostOf(id)+'g')+'</small><div class="stats">'+stats(s)+'</div>'+(at.length?'<small>Hired at '+at.join(', ')+'</small>':'')+'</div></div>'};
const tree=id=>{const kids=UP[id]||[];return '<div class="tree">'+node(id)+(kids.length?'<div class="tkids">'+kids.map(tree).join('')+'</div>':'')+'</div>'};
section('troops','Troop trees','Hire tier 1 troops (and tier 2 riders at castles), then train them in towns: 25 gold to reach tier 2 and 45 to reach tier 3. Where a line forks, you choose the branch. Each hire takes one of the holding’s volunteers. Training also needs experience: your soldiers learn by fighting (XP for the damage they deal, more for each foe they fell by its tier, a little for being there and for winning; less in an auto-resolve; more with Leadership). The survivors pool it by kind, and the fallen take theirs with them. Training one soldier spends his kind’s XP: '+Object.entries(TROOP_XP.need).map(([t,n])=>n+' from tier '+t).join(', ')+'. The Party window and the barracks show each kind’s experience and how many are ready.',
  sub('Unit cards','In a holding’s Recruit tab, click a troop (to hire, or to train into) for its card, as in Total War: its picture, type icon and class; bars for Health, Melee or Missile attack (damage, every so many seconds), Reach or Range, Ammunition, Speed, Vigor and Charge bonus, each against the best troop you can raise; its abilities (hover one for what it does); what it is strong and weak against; and what it costs to hire or train and its upkeep. A training’s card marks each number ▲ or ▼ against the troop it comes from.','')+
  sub('Vigor','How long a unit keeps its wind in battle (Stamina): running, charging and fighting tire it more slowly, and resting restores it faster, by Vigor / 100. Every unit starts at 100; heavy armour ×0.85, a mount ×1.15, shock troops ×1.1, dwarves ×1.15, elves ×1.1, orcs ×1.05, and +5% for each tier above the first.',
    table(['Troop','Vigor'],TROOP_TYPES().sort((a,b)=>vigorOf(ST[b])-vigorOf(ST[a])).slice(0,8).map(k=>[ST[k].n,vigorOf(ST[k])]).concat([['…','']]).concat(TROOP_TYPES().sort((a,b)=>vigorOf(ST[a])-vigorOf(ST[b])).slice(0,4).reverse().map(k=>[ST[k].n,vigorOf(ST[k])]))))+
  Object.keys(RACES).map(r=>{const R=RACES[r];return '<div class="sub"><h3>'+R.n+'</h3><div class="trees">'+[R.melee,R.shield,R.ranged,R.horse].map(k=>'<div class="treebox">'+tree(k)+'</div>').join('')+'</div></div>'}).join('')+
  '<div class="sub"><h3>Mercenaries and bandits</h3><p class="muted">Not tied to a race. You start with some, take them as prisoners, and bandits field them. Camps are led by a chieftain.</p><div class="trees">'+
    ['militia','archer','horse','chief'].map(k=>'<div class="treebox">'+tree(k)+'</div>').join('')+'</div></div>'+
  '<div class="sub"><h3>Companions</h3><div class="grid">'+Object.keys(COMPS).map(c=>{const C=COMPS[c];return '<article class="card entry"><div class="head">'+spr(c,0,3)+'<div><h3>'+C.n+'</h3><span class="muted">'+C.d+'</span></div></div>'+
    kv([['Found in',C.town+' tavern, '+C.cost+'g'],['Likes',Object.keys(C.react).filter(k=>C.react[k]>0).join(', ')||'—'],['Dislikes',Object.keys(C.react).filter(k=>C.react[k]<0).join(', ')||'—']])+'</article>'}).join('')+'</div>'+
  callout('Companions, lords and chieftains are characters, as you are: each has the full skill tree (its own, from the crossroads: two points to start and one a level), fighting skills that rise as they fight, gear in seven slots and perks, and fights as their kind grown by all of it; the tree gives their attributes and active skills, which they use from their own skill slots. Until a character joins you it grows its tree itself along its class’s path (warrior, guardian, rider, archer or caster, by what it fights with); once with you, its points are yours: Manage it in the Party tab and open its skill tree. Lords and chieftains wear gear of their level (a tier every three levels).')+callout('Companions leave when their approval falls to −5. Brann and Elske also quarrel when both travel with you. Give each one a role: '+Object.values(ROLES).join(', ')+'.')+'</div>');

/* gear */
const handN={one:'one-handed',two:'two-handed',hybrid:'hybrid'};
section('gear','Gear and inventory','Press I. Your equipment sits on a body: slots where each piece is worn, five rings by each hand, and your mount with its own three slots below. The bag holds '+INV_SIZE+' slots (more with a pack, a belt or saddlebags); trade goods and trophies share it with gear.',
  sub('Equipment slots','',kv([['Body',['head','face','ear','body','cape','arms','belt','legs','feet','bag'].map(k=>SLOTS[k]).join(', ')],['Hands','Main hand, Off hand, and ten fingers for rings'],['Mount','Mount, plus '+MOUNT_KEYS.map(k=>SLOTS[k]).join(', ')+' (they only count while you ride)']]))+
  sub('Holding weapons','One-handed weapons leave the off hand free for a shield, a tome, a torch or a second weapon (dual wield: the off-hand weapon adds half its damage, and your combo turns quick). Two-handed weapons need both hands and send your off-hand item to the bag. Hybrid weapons (spears) are held in two hands when the off hand is empty (+20% damage, +4 reach) and in one with a shield.',
    table(['Piece','Slot','Grip','Wooden (tier 0)','Silver (tier 3)','Adamant (tier 6)'],Object.keys(BASES).map(b=>{const B=BASES[b];return ['<b>'+B.n+'</b>',SLOTS[B.slot],B.hand?handN[B.hand]:'—',...[0,3,6].map(t=>'<span class="muted" style="font-size:12px">'+statText(ITEMS[gearId(b,t)].m)+'</span>')]})))+
  callout('Materials run '+MATERIALS.map(m=>m.n).join(', ')+'; value doubles with each step. Smiths stock pieces up to a tier that rises with the days (castles forge one higher), and enemies drop them.')+
  sub('Rare gear','Dropped by monsters.',table(['Item','Slot','Rarity','Effect','Value','Dropped by'],Object.keys(ITEMS).filter(k=>ITEMS[k].tier==null&&ITEMS[k].slot!=='mount').map(k=>{const I=ITEMS[k];return ['<span class="rare" style="background:'+RARITY[I.r]+'"></span><b>'+I.n+'</b>',SLOTS[I.slot]+(I.hand?' · '+handN[I.hand]:''),I.r,I.d,I.v+'g',Object.keys(MONSTERS).filter(m=>MONSTERS[m].gear.some(x=>x[0]===k)).map(m=>MONSTERS[m].n).join(', ')||'—']}),[4]))+
  sub('Mounts','Stables sell them; rare beasts need standing '+REP_NEED[2]+' and the right place. A mount speeds your travel; some ignore a biome.',
    table(['Mount','Rarity','Effect','Ignores','Where','Price'],Object.keys(MOUNTS).map(k=>{const M=MOUNTS[k];return ['<b>'+M.n+'</b>',M.r,statText(M.m)+(M.fly?', flies':''),(M.ign||[]).map(x=>L[x]).join(', ')||'—',M.drop?'only as loot':M.where==='any'?'any stable':M.where?M.where+' stables':M.race?RACES[M.race].n+' holdings':L[M.clim]+' holdings',M.drop?'—':Math.round(M.v*1.2)+'g']}),[5]))+
  sub('Trophies','Sell them at any market.',table(['Trophy','Value','From'],Object.keys(MATS).map(k=>['<b>'+MATS[k].n+'</b>',MATS[k].v+'g','<span class="muted">'+[...Object.keys(MONSTERS).filter(m=>MONSTERS[m].mat===k).map(m=>MONSTERS[m].n),...Object.keys(CRITTERS).filter(c=>CRITTERS[c].mat&&CRITTERS[c].mat[0]===k).map(c=>CRITTERS[c].n)].join(', ')+'</span>']),[1])));

/* hero */
const branchOf=k=>TREE_BRANCHES.find(b=>b.k===k);
section('hero','Your hero','Your past sets your weapon, purse and starting place on the skill tree. You gain a skill point every level; disciplines grow as you use them, up to level 10.',
  '<div class="sub"><h3>Pasts</h3><div class="grid">'+Object.keys(BGS).map(k=>{const B=BGS[k],O=TREE['o_'+k];return '<article class="card entry"><h3>'+B.n+'</h3><p class="muted">'+B.d+'</p>'+kv([['Weapon',BASES[B.weapon].n+(B.ammo?' and '+B.ammo[1]+' '+B.ammo[0]:'')],['Gold',B.gold],['Origin',O?O.n+' <span class="muted">'+O.d+'</span>':'—']])+'</article>'}).join('')+'</div></div>'+
  sub('The skill tree','Start at your origin and spend points outward: a node can be taken once it touches one you have, and refunded if nothing beyond needs it. Four paths branch from the Crossroads, joined by hybrid nodes between them.',
    table(['Path','Attribute','Nodes','Notables','Abilities','Keystones'],TREE_BRANCHES.map(b=>{const ns=Object.values(TREE).filter(N=>N.br===b.k);return ['<span class="sw" style="background:'+b.col+'"></span><b>'+b.n+'</b>',ATTRS[b.a][0],ns.length,ns.filter(N=>N.t==='n').length,ns.filter(N=>N.t==='a').length,ns.filter(N=>N.t==='k').map(N=>N.n).join(', ')]}),[2,3,4])+
    '<div class="grid">'+Object.values(TREE).filter(N=>N.t==='k').map(N=>'<article class="card entry"><h3>'+N.n+'</h3><span class="chip">'+(branchOf(N.br)?branchOf(N.br).n:'')+' keystone</span><p class="muted">'+N.d+'</p></article>').join('')+'</div>')+
  sub('Disciplines','',table(['Discipline','Attribute','Does'],Object.keys(SKILLS).map(k=>['<b>'+SKILLS[k].n+'</b>',ATTRS[SKILLS[k].a][0],SKILLS[k].d])))+
  sub('Attributes','Raised by nodes on the tree.',kv(Object.keys(ATTRS).map(k=>[ATTRS[k][0],ATTRS[k][1]]))));

/* threats */
const abil={pounce:'Pounces on a fighter 24–110 px away for 1.6× damage, then waits 4.5 s.',web:'Spits webs (range 60) that halve the target’s speed for 2 s.',regen:'Regenerates 4 health per second.'};
const monCard=id=>{const M=MONSTERS[id],s=ST[M.unit],traits=[s.ability&&abil[s.ability],s.charge&&'Charges for 1.9× damage at full speed.',s.big&&'Huge: takes up more room and ignores battleground rules.'].filter(Boolean);
  return '<article class="card entry"><div class="head">'+spr(M.unit,1,s.big?2:3)+'<div><h3>'+M.n+'</h3><span class="muted">'+M.d+'</span></div></div>'+
