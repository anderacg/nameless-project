<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07090e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ashmark"><meta name="application-name" content="Ashmark"><meta name="format-detection" content="telephone=no">
<title>Ashmark</title>
<!-- installing to a home screen (served over http or https: a manifest does nothing from file://, where Chrome would only log its
     blocked fetch, so it is linked only when served); iOS reads the apple-* tags and the touch icon -->
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<script>if(/^https?:$/.test(location.protocol))document.head.appendChild(Object.assign(document.createElement('link'),{rel:'manifest',href:'manifest.webmanifest'}))</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- the interface is Arial (style.css); this pixel font is only for the words drawn on the map itself (sprites.js txt) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<link rel="stylesheet" href="style.css">
</head><body>
<div class="stage" id="stage">
<div class="screen" id="screen" data-mode="title">
  <canvas id="game" role="img" aria-label="Ashmark game screen: a top-down pixel-art map and battles"></canvas>
  <!-- everything you need sits on the one screen: your party at the top left, the map's minimap at the top right (drawn on the
       canvas), messages at the bottom left, your windows and speed at the bottom right, battle orders at the bottom middle -->
  <div class="hudlayer">
    <section class="pcard" id="stats" aria-label="Your party"></section>
    <div class="toasts" id="log" aria-live="polite"></div>
    <!-- the top bar: the day and the time, and the time's speed; under it, a hint for where you are -->
    <div class="wtop" id="wtop">
      <span class="wday" id="wday"></span>
      <span class="wtime" role="group" aria-label="Time (Space pauses)">
        <button class="tbtn" id="pause" type="button" title="Pause or play (Space)"></button>
        <button class="tbtn on" type="button" data-speed="1" title="Normal speed (1)">1×</button>
        <button class="tbtn" type="button" data-speed="2" title="Fast (2)">2×</button>
        <button class="tbtn" type="button" data-speed="3" title="Fastest (3)">3×</button>
      </span>
    </div>
    <p class="hint" id="hint"></p>
    <div class="staybar" id="staybar" role="status" hidden></div>
    <!-- your windows (bottom right): icon tiles, their keys in the corner; and the game's own (save, full screen, menu) -->
    <nav class="dock" aria-label="Windows">
      <div class="dockrow">
        <button class="dbtn" id="charBtn" type="button" title="Character: your hero, party, quests, lords and realms (C)" data-ico="hero" data-key="C">Hero</button>
        <button class="dbtn" id="skillBtn" type="button" title="Skills and talents (K)" data-ico="skills" data-key="K">Skills</button>
        <button class="dbtn" id="invBtn" type="button" title="Inventory (I)" data-ico="bag" data-key="I">Bag</button>
        <button class="dbtn" id="journalBtn" type="button" title="Message log (L)" data-ico="log" data-key="L">Log</button>
        <button class="dbtn" id="helpBtn" type="button" title="Controls and help (H)" data-ico="help" data-key="H">Help</button>
      </div>
      <div class="dockrow sys">
        <button class="dbtn" id="saveBtn" type="button" title="Quick save (F6); save to a slot from the menu (Esc)" data-ico="save" data-key="F6">Save</button>
        <button class="dbtn" id="fsBtn" type="button" title="Full screen (F11)" data-ico="full">Full</button>
        <button class="dbtn" id="menuBtn" type="button" title="Main menu (Esc)" data-ico="menu" data-key="Esc">Menu</button>
      </div>
    </nav>
    <div class="tip" id="tip" hidden></div>
    <!-- the battle HUD, laid out as in Total War: the balance of power at the top middle, time at the top right (the small map of
         the field under it, drawn on the canvas), the selected unit's details at the bottom left, and at the bottom middle the orders
         over a row of unit cards. Icons are filled in at load (battlehud.js) -->
    <div class="bhud" id="bbar" hidden>
      <div class="btop" role="status">
        <div class="bpow"><span class="bside me"><b id="bMine">0</b> Your band</span><span class="bpowbar" aria-hidden="true"><i id="bPowMe"></i></span><span class="bside foe">Enemy <b id="bFoe">0</b></span></div>
        <div class="bfield"><span id="bField"></span><span id="bStatus"></span></div>
      </div>
      <div class="btime" role="group" aria-label="Battle speed (Space pauses; [ and ] slower, faster)">
        <button class="btn sm" type="button" id="bPause" aria-pressed="false" title="Pause: you can still give orders (Space)">⏸ Pause</button>
        <button class="btn sm" type="button" data-bspeed="0.5" aria-pressed="false">0.5×</button>
        <button class="btn sm" type="button" data-bspeed="1" aria-pressed="false">1×</button>
        <button class="btn sm" type="button" data-bspeed="2" aria-pressed="false">2×</button>
        <button class="btn sm" type="button" data-bspeed="5" aria-pressed="false">5×</button>
        <button class="btn sm" type="button" id="bSkills" aria-pressed="true" title="K · Auto skills: your hero and companions use their skills and special moves (Shield Bash, Shove, Dodge) when the moment is right; off, never">Skills</button>
        <button class="btn sm" type="button" id="bAuto" aria-pressed="false" title="A · The AI commands your army (off: they do only what you order; any order takes it back)">AI</button>
        <button class="btn sm" type="button" id="hpBtn" aria-pressed="true" title="Health bars over every fighter">HP</button>
      </div>
      <section class="binfo" id="bInfo" aria-label="Selected unit"></section>
      <div class="bcmd">
        <div class="borders">
          <div class="ogrp" role="group" aria-label="Orders">
            <button class="obtn" type="button" data-order="hold" data-key="H" title="Hold: stop and stand in formation where they are (H)"></button>
            <button class="obtn" type="button" data-order="charge" data-key="C" title="Run: they move at a run; a run at an enemy is a charge (C)"></button>
            <button class="obtn" type="button" data-order="advance" data-key="V" title="Walk: they move at a walk, keeping their formation (V)"></button>
            <button class="obtn" type="button" data-order="withdraw" data-key="W" title="Withdraw: flee the battle off your edge of the field, striking no one; once everyone has withdrawn, the battle ends as your retreat (W)"></button>
          </div>
          <div class="ogrp" role="group" aria-label="How they move and fight">
            <button class="obtn" type="button" data-flag="firm" data-key="F" aria-pressed="false" title="Hold their ground: strike only what comes into reach (F)"></button>
            <button class="obtn" type="button" data-flag="cease" data-key="Q" aria-pressed="false" title="Cease fire: your shooters hold their shots, loosing only at an enemy you set them on; off, they shoot whatever comes into range (Q)"></button>
            <button class="obtn" type="button" data-flag="skirmish" data-key="E" aria-pressed="false" title="Skirmish: your shooters keep their distance: when a foe who fights hand to hand comes inside 60% of their range they back away, facing him, till he is at 85% of it, then shoot again (E)"></button>
            <button class="obtn" type="button" data-flag="melee" data-key="X" aria-pressed="false" title="Melee Mode (shooters only): on, your shooters put their bows away, stop shooting, and fight hand to hand as fighters do, with their (low) melee damage; off, they shoot, point blank if need be (X)"></button>
          </div>
          <div class="ogrp forms" role="group" aria-label="Shield ability and formations (B toggles shields; L/T again: line; drag for width and depth)">
            <button class="obtn" type="button" data-flag="shieldWall" data-key="B" title="Shield wall: eligible shield infantry only; nearby supporting shields required for protection (B)" aria-pressed="false"></button>
            <button class="obtn" type="button" data-form="loose" aria-pressed="false"></button>
            <button class="obtn" type="button" data-form="wedge" aria-pressed="false"></button>
          </div>
        </div>
        <div class="bcards" role="group" aria-label="Your units (click to select)">
          <!-- Populated from this army's actual groups, never tactical categories. -->
        </div>
      </div>
      <!-- the manual control of your hero, set aside for now (RTS command: battle.js); kept, hidden -->
      <button class="btn sm primary" type="button" id="swing" style="display:none">Attack</button>
      <span class="slotbar" id="slotbar" role="group" aria-label="Skill slots" style="display:none"></span>
      <button class="btn sm" type="button" data-skill="dodge" style="display:none">F Dodge</button>
      <button class="btn sm" type="button" id="block" style="display:none">Block</button>
    </div>
  </div>
  <div class="overlay" id="ov"><div class="panel" id="panel" role="dialog" aria-live="polite"></div></div>
</div>
</div>
