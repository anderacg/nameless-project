<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ashmark · Terrain tile prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111615;color:#e2d4af;font:14px Arial,sans-serif;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:12px}header,nav{background:#302419;border:1px solid #977641;padding:10px;box-shadow:inset 0 0 0 2px #171914}h1{font-size:18px;margin:0 0 5px}p{margin:4px 0;color:#b9b7a4}main{min-height:0;display:flex;justify-content:center;align-items:center;overflow:hidden}canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}button,a{font:inherit;color:#e2d4af;background:#1c201c;border:1px solid #78633c;padding:9px 12px;text-decoration:none;min-height:38px;cursor:pointer}button:hover,button[aria-pressed=true]{color:#ffe3a3;border-color:#d1aa59;background:#4b3921}button:active{transform:translateY(1px)}#timing{color:#dfc986;font-variant-numeric:tabular-nums}@media(max-height:450px){body{gap:5px;padding:6px}header,nav{padding:6px}header{display:flex;gap:15px;align-items:center}h1{font-size:16px}p{font-size:12px}}
</style>
</head>
<body>
<header><div><h1>Terrain tile prototype</h1><p>Grassland, a curved road and a riverbank. Units and buildings stay separate.</p></div><p id="timing" role="status">Loading local terrain tiles…</p></header>
<main><canvas id="terrain" width="512" height="512" aria-label="Terrain tile preview"></canvas></main>
<nav aria-label="Preview terrain"><button data-view="grass">Grass</button><button data-view="road">Road</button><button data-view="river">Riverbank</button><button data-view="combined" aria-pressed="true">Combined</button><button id="rebuild">Rebuild</button><a href="Ashmark.html">Game</a></nav>
<script src="js/gfx/tileground.js"></script>
<script>
'use strict';
const cv=document.getElementById('terrain'),g=cv.getContext('2d'),timing=document.getElementById('timing');let mode='combined';
function bezier(points,width){const out=[];let last=null;for(let i=0;i<=160;i++){const t=i/160,u=1-t,x=u*u*u*points[0][0]+3*u*u*t*points[1][0]+3*u*t*t*points[2][0]+t*t*t*points[3][0],y=u*u*u*points[0][1]+3*u*u*t*points[1][1]+3*u*t*t*points[2][1]+t*t*t*points[3][1],hw=width*(.9+.12*Math.sin(t*5));if(last)out.push(last[0],last[1],x,y,last[2],hw);last=[x,y,hw]}return Float32Array.from(out)}
const roads=bezier([[-32,235],[50,270],[110,60],[110,-32]],5.4),rivers=bezier([[190,-32],[290,90],[100,160],[205,288]],10);
function draw(){const scene=TileGround.makeScene({seed:41,roads:mode==='road'||mode==='combined'?roads:[],rivers:mode==='river'||mode==='combined'?rivers:[]});g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,256,256);let t=performance.now();TileGround.draw(g,scene,0,0,256,256);const cold=performance.now()-t;t=performance.now();TileGround.draw(g,scene,0,0,256,256);const warm=performance.now()-t;timing.textContent='First draw '+cold.toFixed(2)+' ms · Cached '+warm.toFixed(2)+' ms';window.tilePreview={scene,cold,warm};document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===mode)))}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.view;draw()}));document.getElementById('rebuild').addEventListener('click',draw);
TileGround.load().then(ok=>{if(ok)draw();else timing.textContent='Could not load local terrain tiles.'});
</script>
</body>
</html>
