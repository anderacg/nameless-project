<!doctype html>
<html><head><meta charset="utf-8"><title>16px roster</title>
<style>
body{margin:0;background:#8a8a8a;color:#1c1c28;font:13px monospace;padding:14px}
h3{margin:12px 0 6px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.cell{display:flex;flex-direction:column;align-items:center;gap:3px}
.cell span{font-size:10px;color:#2a2a38}
canvas{image-rendering:pixelated}
.field{background:#5f8a3f;padding:8px;display:inline-block}
</style></head><body>
<script>
'use strict';
const G=(w,h)=>({w,h,p:new Array(w*h).fill(null)});
const set=(g,x,y,c)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<g.w&&y<g.h)g.p[y*g.w+x]=c||null};
const get=(g,x,y)=>x>=0&&y>=0&&x<g.w&&y<g.h?g.p[y*g.w+x]:null;
const rect=(g,x,y,w,h,c)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++)set(g,x+i,y+j,c)};
const vline=(g,x,y0,y1,c)=>{for(let y=y0;y<=y1;y++)set(g,x,y,c)};
const stamp=(d,s,ox,oy,keep)=>{for(let y=0;y<s.h;y++)for(let x=0;x<s.w;x++){const c=s.p[y*s.w+x];if(c&&(!keep||keep(x,y)))set(d,ox+x,oy+y,c)}};
const OUT='#181828';
// round a block: clear its four corners (before the outline)
const cut=(g,x,y,w,h)=>{for(const [a,b] of [[x,y],[x+w-1,y],[x,y+h-1],[x+w-1,y+h-1]])if(a>=0&&b>=0&&a<g.w&&b<g.h)g.p[b*g.w+a]=null};
function outline(g){const o=[];for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++)if(!get(g,x,y)&&(get(g,x-1,y)||get(g,x+1,y)||get(g,x,y-1)||get(g,x,y+1)))o.push([x,y]);for(const [x,y] of o)set(g,x,y,OUT)}
// three-tone ramps: [light, mid, dark]
const R={
  skin:['#ffe0c0','#f2b890','#c8865e'],orc:['#b8e070','#78b040','#4a7a28'],
  blond:['#fff0a0','#e8c050','#b08a28'],brown:['#c08850','#8a5a30','#5a3a1e'],red:['#ff9a60','#d85a30','#9a3418'],grey:['#ffffff','#c8c8d0','#8a8a9a'],black:['#5a5a6a','#34344a','#1e1e2e'],
  steel:['#eef4fa','#aab8c8','#6a7a90'],gold:['#fff4a0','#f0c040','#b07a18'],wood:['#d8a060','#9a6430','#643e1c'],
  blue:['#80c0ff','#3a80e0','#2048a0'],red2:['#ff8080','#d83c3c','#902028'],green:['#a0e080','#4aa848','#26703a'],teal:['#80e8d8','#30a8a0','#1a6a70'],
  purple:['#c8a0ff','#8058d0','#4a3090'],olive:['#d8d070','#a09838','#6a6420'],orange:['#ffc070','#f08030','#a84a18'],
  leather:['#c89060','#8a5a34','#583820'],cloth:['#f0e8d0','#c8b898','#8a7a60'],white:['#ffffff','#d8dce8','#9aa0b8'],
  horse:['#c88a50','#8a5a2e','#5a3818'],horseW:['#ffffff','#dcd8d0','#a8a098'],horseB:['#5a5a6a','#34344a','#202030'],mane:['#5a3a1e','#3a2410','#22140a']
};
// a front-facing figure in a 16×16 cell, standing on y 15. o: skin, hair, helm, body (its colour), team, legs, weapon, shield, beard, small
function unit(o){
  const g=G(16,16),S=R[o.skin||'skin'],Hh=R[o.hair||'blond'],T=R[o.team||'blue'],B=R[o.body]||T,L=R[o.legs||'leather'],dy=o.short?2:0;
  // legs and boots
  if(!o.robe){rect(g,5,12,2,2,L[1]);rect(g,9,12,2,2,L[2]);rect(g,5,14,2,1,L[2]);rect(g,9,14,2,1,L[2]);set(g,5,12,L[0])}
  else{rect(g,4,12,8,3,B[1]);rect(g,10,12,2,3,B[2]);rect(g,4,12,1,3,B[0]);rect(g,5,14,2,1,B[2])}
  // the body: a tunic (the team's colour) over the armour, arms at its sides, hands
  rect(g,4,7+dy,8,5-dy,B[1]);rect(g,4,7+dy,1,5-dy,B[0]);rect(g,11,7+dy,1,5-dy,B[2]);
  rect(g,6,7+dy,4,5-dy,T[1]);rect(g,6,7+dy,1,5-dy,T[0]);rect(g,9,7+dy,1,5-dy,T[2]);
  rect(g,4,11,8,1,R.leather[2]);set(g,7,11,R.gold[1]);
  rect(g,3,8+dy,1,3-dy,B[1]);rect(g,12,8+dy,1,3-dy,B[2]);set(g,3,11,S[1]);set(g,12,11,S[1]);
  // the head: hair behind, the face, eyes; then the hair's fringe or a helm
  const hy=1+dy;
  rect(g,5,hy,6,6,Hh[1]);rect(g,4,hy+1,1,5,Hh[2]);rect(g,11,hy+1,1,5,Hh[2]);
  rect(g,6,hy+2,4,4,S[1]);rect(g,6,hy+2,4,1,S[0]);set(g,9,hy+5,S[2]);set(g,6,hy+3,o.eye||'#3a5a8a');set(g,9,hy+3,o.eye||'#3a5a8a');
  rect(g,5,hy,6,2,Hh[1]);rect(g,6,hy,3,1,Hh[0]);set(g,5,hy+2,Hh[1]);set(g,10,hy+2,Hh[2]);
  if(o.beard){rect(g,6,hy+4,4,3,R[o.beard][1]);set(g,6,hy+4,R[o.beard][0]);rect(g,7,hy+7,2,1,R[o.beard][2])}
  if(o.tusk){set(g,6,hy+5,'#ffffff');set(g,9,hy+5,'#ffffff')}
  if(o.ears){set(g,4,hy+2,S[1]);set(g,11,hy+2,S[1]);set(g,3,hy+1,S[0]);set(g,12,hy+1,S[2])}
  const h=o.helm,M=R.steel;
  if(h==='cap'){rect(g,5,hy-1,6,3,M[1]);rect(g,5,hy-1,6,1,M[0]);rect(g,4,hy+1,8,1,M[2])}
  if(h==='great'){rect(g,4,hy-1,8,7,M[1]);rect(g,4,hy-1,8,1,M[0]);rect(g,11,hy,1,6,M[2]);rect(g,5,hy+3,6,1,OUT);set(g,7,hy+4,M[2]);set(g,8,hy+4,M[2])}
  if(h==='plume'){rect(g,4,hy-1,8,7,M[1]);rect(g,4,hy-1,8,1,M[0]);rect(g,11,hy,1,6,M[2]);rect(g,5,hy+3,6,1,OUT);rect(g,7,hy-3,3,2,R.red2[1]);set(g,7,hy-3,R.red2[0]);set(g,10,hy-2,R.red2[2])}
  if(h==='horned'){rect(g,5,hy-1,6,3,M[1]);rect(g,5,hy-1,6,1,M[0]);set(g,4,hy-2,R.cloth[0]);set(g,4,hy-1,R.cloth[1]);set(g,11,hy-2,R.cloth[1]);set(g,11,hy-1,R.cloth[2]);set(g,7,hy+2,M[2])}
  if(h==='hood'){const C=R[o.hood||'green'];rect(g,4,hy-1,8,7,C[1]);rect(g,4,hy-1,8,1,C[0]);rect(g,11,hy,1,6,C[2]);rect(g,6,hy+2,4,4,S[1]);rect(g,6,hy+2,4,1,S[0]);set(g,6,hy+3,'#3a5a8a');set(g,9,hy+3,'#3a5a8a')}
  if(h==='wizard'){const C=R.purple;rect(g,4,hy+1,8,1,C[2]);rect(g,5,hy-1,6,2,C[1]);rect(g,6,hy-3,4,2,C[1]);set(g,7,hy-4,C[0]);set(g,6,hy-1,C[0])}
  if(h==='crown'){rect(g,5,hy-1,6,1,R.gold[1]);set(g,5,hy-2,R.gold[0]);set(g,7,hy-2,R.gold[1]);set(g,8,hy-2,R.gold[1]);set(g,10,hy-2,R.gold[2]);set(g,7,hy-1,R.red2[1])}
  // a round head: its corners off
  if(h==='great'||h==='plume'||h==='hood')cut(g,4,hy-1,8,7);else if(h==='cap'||h==='horned'){set(g,5,hy-1,null)}else{g.p[hy*16+5]=null;g.p[hy*16+10]=null;g.p[(hy+1)*16+4]=null;g.p[(hy+1)*16+11]=null}
  g.p[(7+dy)*16+4]=null;g.p[(7+dy)*16+11]=null;
  // the shield (left) and the weapon (right), upright at their sides
  const W=R.wood;
  if(o.shield){rect(g,1,8,4,4,R[o.shieldC||'wood'][1]);rect(g,1,8,4,1,R[o.shieldC||'wood'][0]);rect(g,2,9,2,2,T[1]);set(g,2,9,R.gold[1])}
  const wp=o.weapon;
  if(wp==='spear'){vline(g,13,1,15,W[1]);set(g,13,0,M[0]);set(g,13,1,M[1]);set(g,12,2,M[2]);set(g,14,2,M[2])}
  if(wp==='sword'){vline(g,13,3,10,M[0]);vline(g,14,4,10,M[2]);rect(g,12,10,3,1,R.gold[1]);set(g,13,11,W[2])}
  if(wp==='axe'){vline(g,13,4,14,W[1]);rect(g,14,4,2,3,M[1]);set(g,14,4,M[0]);set(g,15,6,M[2])}
  if(wp==='bow'){vline(g,14,4,13,W[1]);set(g,13,3,W[1]);set(g,13,14,W[1]);set(g,15,8,W[2]);vline(g,13,4,13,'#e8e8d8')}
  if(wp==='staff'){vline(g,13,2,15,W[1]);set(g,13,1,R.teal[0]);set(g,12,1,R.teal[1]);set(g,14,1,R.teal[1]);set(g,13,0,R.teal[1])}
  if(wp==='trident'){vline(g,13,2,15,R.gold[2]);rect(g,12,1,3,1,R.gold[1]);set(g,12,0,R.gold[0]);set(g,14,0,R.gold[0]);set(g,13,0,R.gold[0])}
  if(wp==='bigaxe'){vline(g,13,2,15,W[1]);rect(g,14,2,2,4,M[1]);set(g,14,2,M[0]);rect(g,11,2,2,3,M[1])}
  outline(g);return g;
}
// a mount: the very same rider (above the belt) on a horse seen from the side; cell 32×32 (twice the foot)
function mounted(o){
  const g=G(32,32),H=R[o.horse||'horse'],M=R.mane,T=R[o.team||'blue'];
  // tail, far legs, body, near legs, neck and head
  vline(g,4,18,24,M[1]);vline(g,5,17,23,M[2]);
  rect(g,8,25,2,5,H[2]);rect(g,21,25,2,5,H[2]);
  rect(g,6,17,19,8,H[1]);rect(g,6,17,19,1,H[0]);rect(g,6,24,19,1,H[2]);rect(g,6,18,1,6,H[0]);
  rect(g,10,25,2,5,H[1]);rect(g,23,25,2,5,H[1]);rect(g,8,30,4,1,OUT==='x'?0:'#2a1e14');rect(g,21,30,4,1,'#2a1e14');
  rect(g,23,11,4,8,H[1]);rect(g,23,11,1,8,H[0]);rect(g,25,8,6,4,H[1]);rect(g,25,8,6,1,H[0]);rect(g,29,11,2,1,H[2]);set(g,28,9,OUT);set(g,26,6,H[1]);set(g,26,7,H[1]);
  cut(g,6,17,19,8);cut(g,25,8,6,4);cut(g,23,11,4,8);
  vline(g,22,9,17,M[1]);vline(g,23,8,10,M[2]);
  if(o.caparison){rect(g,6,18,19,6,T[1]);rect(g,6,18,19,1,T[0]);rect(g,6,23,19,1,T[2]);for(let x=7;x<25;x+=3)set(g,x,24,T[2]);rect(g,6,20,19,1,R.gold[1])}
  else{rect(g,11,16,7,2,R.leather[1]);rect(g,11,16,7,1,R.leather[0])}
  // the rider, the same pixels as on foot, above the belt; a leg down the horse's side
  const r=unit(o);stamp(g,r,7,4,(x,y)=>y<=11);
  rect(g,12,16,2,4,R[o.legs||'leather'][1]);rect(g,12,20,3,1,R.leather[2]);
  outline(g);return g;
}
function draw(g,k){const c=document.createElement('canvas');c.width=g.w*k;c.height=g.h*k;const x=c.getContext('2d');for(let y=0;y<g.h;y++)for(let i=0;i<g.w;i++){const p=g.p[y*g.w+i];if(p){x.fillStyle=p;x.fillRect(i*k,y*k,k,k)}}return c}
const U=[
  ['Levy',{helm:'cap',body:'leather',team:'blue',weapon:'spear',hair:'brown'}],
  ['Spearman',{helm:'cap',body:'steel',team:'blue',weapon:'spear',shield:true}],
  ['Man-at-arms',{helm:'great',body:'steel',team:'blue',weapon:'sword',shield:true,shieldC:'steel'}],
  ['Bowman',{helm:'hood',hood:'green',body:'leather',team:'olive',weapon:'bow',hair:'brown'}],
  ['Mage',{helm:'wizard',body:'purple',team:'blue',weapon:'staff',robe:true,beard:'grey',hair:'grey'}],
  ['Knight',{helm:'plume',body:'steel',team:'blue',weapon:'sword',shield:true,shieldC:'steel'}],
  ['Hero',{helm:'crown',body:'steel',team:'blue',weapon:'sword',hair:'blond'}],
  ['Priestess',{body:'white',team:'teal',weapon:'staff',robe:true,hair:'blond'}],
  ['Dwarf',{short:true,helm:'horned',body:'steel',team:'red2',weapon:'axe',shield:true,beard:'red',hair:'red'}],
  ['Elf',{ears:true,body:'green',team:'teal',weapon:'bow',hair:'blond'}],
  ['Orc',{skin:'orc',helm:'horned',body:'leather',team:'red2',weapon:'bigaxe',tusk:true,hair:'black'}],
  ['Villager',{body:'cloth',team:'orange',hair:'brown',legs:'cloth'}]
];
const add=(p,c,l)=>{const d=document.createElement('div');d.className='cell';d.appendChild(c);if(l){const s=document.createElement('span');s.textContent=l;d.appendChild(s)}p.appendChild(d)};
const sec=t=>{const h=document.createElement('h3');h.textContent=t;document.body.appendChild(h);const r=document.createElement('div');r.className='row';document.body.appendChild(r);return r};
let r=sec('Foot · 16×16 · shown 6×');for(const [n,o] of U)add(r,draw(unit(o),6),n);
r=sec('The other side');for(const [n,o] of U.slice(0,7))add(r,draw(unit({...o,team:'red2'}),6),n);
r=sec('Mounted · 32×32 · the same rider · shown 6×');add(r,draw(mounted({...U[1][1]}),6),'Spearman');add(r,draw(mounted({...U[5][1],horse:'horseW',caparison:true}),6),'Knight, barded');add(r,draw(mounted({...U[5][1],team:'red2',caparison:true,horse:'horseB'}),6),'Enemy knight');
r=sec('At play size · 1×, 2×, 3×');
for(const k of [1,2,3]){const f=document.createElement('div');f.className='field';const c=document.createElement('canvas');c.width=(U.length*14+40)*k;c.height=36*k;const x=c.getContext('2d');let px=2;
  for(const [n,o] of U){x.drawImage(draw(unit(o),k),px*k,18*k);px+=14}x.drawImage(draw(mounted({...U[5][1],horse:'horseW',caparison:true}),k),px*k,2*k);f.appendChild(c);r.appendChild(f)}
</script>
</body></html>
