<!doctype html>
<html><head><meta charset="utf-8"><title>16px roster, from the reference's template</title>
<style>
body{margin:0;background:#7c7c84;color:#16161e;font:13px monospace;padding:14px}
h3{margin:12px 0 6px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.cell{display:flex;flex-direction:column;align-items:center;gap:3px}
.cell span{font-size:10px;color:#22222e}
canvas,img{image-rendering:pixelated}
.field{background:#5f8a3f;padding:8px;display:inline-block}
</style></head><body>
<h3>The reference (Basic Humanoid II) · 4×</h3>
<img src="file:///F:/Game Project/Nameless/doc/references/Basic Asset Pack/Basic Humanoid II Sprites/Basic Humanoid II 4x.png">
<script>
'use strict';
/* every figure is the same template, its letters a part and a tone: hair 1 2 3 (light to dark), skin s (lit) x (lighter, between
   the eyes) t (shade, the blush) u (the chin's shadow), e the eyes; the outer garment (armour, a cloak) a b c d (light to dark),
   the front (the team's colour) p q r, the under-tunic n o, the belt and skirt k l, legs L M, feet F. The outline comes after. */
const ADULT=[
  '................',
  '......112.......',
  '.....12232......',
  '.....2s3s3......',
  '.....1sexe......',
  '.....1ttxt......',
  '.....12uu2......',
  '....a2pqq2d.....',
  '...abpqqrcd.....',
  '...bcpnnrcd.....',
  '...bspnnrsd.....',
  '...bcqoorcd.....',
  '...bckllkcd.....',
  '.....LL.LM......',
  '.....F...F......',
  '................'];
const OUT='#1a1c26';
// the reference's own palette, by material: [light .. dark]
const P={
  skin:['#edd1d6','#f3bfad','#de9e8c','#c58faa'],orc:['#c8e888','#9ccc5a','#6a9a3a','#4a6a2a'],
  blond:['#faf8db','#f3e7a8','#dab580','#b3794d'],brown:['#cb804a','#a15735','#682a19','#4a1c10'],ginger:['#fea464','#fc6a08','#ba3900','#7e0e13'],
  grey:['#ffffff','#dacdc1','#b3a49a','#8f8685'],black:['#67656d','#3d3f4b','#3c4851','#27272c'],
  olive:['#ebe185','#beb050','#8e8e37','#5d6527'],teal:['#86f1d6','#4ddbc2','#30b3a7','#238585'],steel:['#ffffff','#abd5da','#6e95a9','#5a748d'],
  violet:['#a5a4d0','#888cbc','#7270ab','#575191'],orange:['#ffdc04','#ffc02a','#cd7900','#ae5800'],wood:['#cb804a','#a15735','#682a19','#4a1c10'],
  blue:['#a9d4fb','#398dd5','#3056ac','#353287'],red:['#ea7e82','#c74453','#aa1e42','#891a37'],green:['#8cd590','#4ddbc2','#238585','#1e5459'],
  cloth:['#e7d494','#cea65f','#9c8850','#6f4d2b'],dark:['#44563e','#37403c','#404945','#27272c'],leather:['#cb804a','#a15735','#682a19','#402830'],
  white:['#faf8db','#dacdc1','#b3a49a','#75776c'],purple:['#dfb2c6','#9b6aa2','#6a4a8a','#3a2a5a'],
  horse:['#cb804a','#a15735','#682a19','#4a1c10'],horseW:['#faf8db','#dacdc1','#b3a49a','#75776c'],horseB:['#67656d','#3d3f4b','#27272c','#1a1c26']
};
const EYE='#9ee4ef';
function letter(c,o){
  const H=P[o.hair||'blond'],S=P[o.skin||'skin'],A=P[o.outer||'olive'],T=P[o.team||'blue'],I=P[o.inner||'dark'],K=P[o.belt||'leather'],L=P[o.legs||'leather'];
  return {'1':H[0],'2':H[2],'3':H[3],s:S[1],x:S[0],t:S[2],u:S[3],e:o.eye||EYE,a:A[0],b:A[1],c:A[2],d:A[3],p:T[0],q:T[1],r:T[2],n:I[0],o:I[1],k:K[0],l:K[1],L:L[1],M:L[2],F:L[3]}[c];
}
const G=(w,h)=>({w,h,p:new Array(w*h).fill(null)});
const set=(g,x,y,c)=>{if(x>=0&&y>=0&&x<g.w&&y<g.h)g.p[y*g.w+x]=c||null};
const get=(g,x,y)=>x>=0&&y>=0&&x<g.w&&y<g.h?g.p[y*g.w+x]:null;
function outline(g){const o=[];for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++)if(!get(g,x,y)&&(get(g,x-1,y)||get(g,x+1,y)||get(g,x,y-1)||get(g,x,y+1)))o.push([x,y]);for(const [x,y] of o)set(g,x,y,OUT)}
const paint=(g,rows,map)=>rows.forEach((r,y)=>[...r].forEach((c,x)=>{if(c!=='.')set(g,x,y,map(c,x,y))}));
const vl=(g,x,y0,y1,c)=>{for(let y=y0;y<=y1;y++)set(g,x,y,c)};
// a figure: the template in its colours, then what it wears on its head, its shield and its weapon
function unit(o){
  const g=G(16,16);
  paint(g,ADULT,c=>letter(c,o));
  // short hair: none on the shoulders
  if(o.shortHair){set(g,5,7,letter('a',o));set(g,9,7,letter('c',o));set(g,5,6,letter('t',o))}
  if(o.robe){for(const [x,y] of [[5,13],[6,13],[8,13],[9,13],[7,13]])set(g,x,y,letter('c',o));set(g,5,14,null);set(g,9,14,null);set(g,4,13,letter('b',o));set(g,10,13,letter('d',o))}
  if(o.beard){const B=P[o.beard];set(g,6,5,B[1]);set(g,7,5,B[1]);set(g,8,5,B[0]);set(g,9,5,B[1]);set(g,6,6,B[2]);set(g,7,6,B[1]);set(g,8,6,B[1]);set(g,9,6,B[2]);set(g,7,7,B[2]);set(g,8,7,B[3])}
  if(o.ears){set(g,4,3,letter('s',o));set(g,4,4,letter('t',o))}
  if(o.tusk)set(g,9,6,'#faf8db');
  const M=P.steel,h=o.helm;
  if(h==='cap'){set(g,6,1,M[0]);set(g,7,1,M[1]);set(g,8,1,M[2]);set(g,5,2,M[0]);set(g,6,2,M[1]);set(g,7,2,M[1]);set(g,8,2,M[2]);set(g,9,2,M[3]);set(g,4,3,M[2]);set(g,10,3,M[3])}
  if(h==='great'||h==='plume'){for(let y=1;y<=6;y++)for(let x=5;x<=9;x++)if(!(y===1&&(x===5||x===9)))set(g,x,y,x<7?M[1]:x<9?M[2]:M[3]);set(g,6,1,M[0]);set(g,5,2,M[0]);
    set(g,7,4,OUT);set(g,8,4,OUT);set(g,9,4,OUT);set(g,8,6,M[3]);if(h==='plume'){set(g,6,0,P.red[1]);set(g,7,0,P.red[0]);set(g,5,0,P.red[2])}}
  if(h==='horned'){set(g,6,1,M[0]);set(g,7,1,M[1]);set(g,8,1,M[2]);set(g,5,2,M[1]);set(g,6,2,M[1]);set(g,7,2,M[1]);set(g,8,2,M[2]);set(g,9,2,M[3]);set(g,4,1,P.white[0]);set(g,4,0,P.white[1]);set(g,10,1,P.white[2]);set(g,10,0,P.white[1])}
  if(h==='hood'){const C=P[o.hood||'green'];for(const [x,y] of [[6,1],[7,1],[8,1],[5,2],[6,2],[7,2],[8,2],[9,2],[5,3],[5,4],[5,5],[5,6],[9,3]])set(g,x,y,x<7?C[1]:C[2]);set(g,6,1,C[0]);set(g,4,6,C[2]);set(g,4,7,C[3])}
  if(h==='wizard'){const C=P.purple;for(let x=4;x<=10;x++)set(g,x,2,x<7?C[1]:C[2]);set(g,6,1,C[1]);set(g,7,1,C[1]);set(g,8,1,C[2]);set(g,7,0,C[0]);set(g,5,3,C[2])}
  if(h==='crown'){set(g,6,1,P.orange[1]);set(g,7,1,P.red[1]);set(g,8,1,P.orange[2]);set(g,6,0,P.orange[0]);set(g,8,0,P.orange[1])}
  // the shield on its left, in front; the weapon upright in its right hand, a hand on the grip
  if(o.shield){const C=P[o.shieldC||'wood'],T=P[o.team||'blue'];for(let y=8;y<=11;y++){set(g,2,y,C[1]);set(g,3,y,y===8?C[0]:C[2])}set(g,2,9,T[1]);set(g,2,10,T[2]);set(g,3,12,C[3]);set(g,2,12,C[2])}
  const W=P.wood,wx=11,wp=o.weapon;
  if(wp)set(g,10,10,letter('s',o));
  if(wp==='spear'){vl(g,wx,2,14,W[1]);set(g,wx,1,M[1]);set(g,wx,0,M[0])}
  if(wp==='sword'){vl(g,wx,4,9,M[1]);set(g,wx,3,M[0]);set(g,wx,10,P.orange[2]);set(g,wx,11,W[2])}
  if(wp==='axe'){vl(g,wx,4,13,W[1]);set(g,wx+1,3,M[1]);set(g,wx+1,4,M[0]);set(g,wx+1,5,M[2])}
  if(wp==='bow'){vl(g,wx+1,5,11,W[1]);set(g,wx,4,W[1]);set(g,wx,12,W[2]);vl(g,wx,5,11,P.white[1])}
  if(wp==='staff'){vl(g,wx,3,14,W[1]);set(g,wx,2,P.teal[1]);set(g,wx,1,P.teal[0])}
  if(wp==='bigaxe'){vl(g,wx,2,14,W[1]);set(g,wx+1,2,M[1]);set(g,wx+1,3,M[0]);set(g,wx+1,4,M[2]);set(g,wx-1,2,M[2])}
  outline(g);return g;
}
// a mount: the very same rider above the belt, on a horse in a 32×32 cell
function mounted(o){
  const g=G(32,32),H=P[o.horse||'horse'],T=P[o.team||'blue'],Mn=P.dark;
  const rows=[
  '..........................yy....',
  '.........................yHHy...',
  '........................mHhHHh..',
  '.......................mHHHHHHH.',
  '......................mHHH..hH..',
  '.....................mHHH.......',
  '.......hhhhhhhhhhhhhhHHH........',
  '.....mhHHHHHHHHHHHHHHHH.........',
  '....m.hHHHHHHHHHHHHHHHd.........',
  '....m.dHHHHHHHHHHHHHHdd.........',
  '......ddddddddddddddd...........',
  '.......dd.dd....dd.dd...........',
  '.......dd.dd....dd.dd...........',
  '.......dd.dd....dd.dd...........',
  '.......dd.dd....dd.dd...........',
  '.......ff.ff....ff.ff...........'];
  rows.forEach((r,y)=>[...r].forEach((c,x)=>{const col={H:H[1],h:H[0],d:H[2],y:H[2],m:Mn[1],f:'#27272c'}[c];if(col)set(g,x,15+y,col)}));
  if(o.caparison){for(let x=7;x<=21;x++){set(g,x,22,T[1]);set(g,x,23,T[2]);set(g,x,24,x%2?T[3]:T[2])}for(let x=7;x<=21;x++)set(g,x,21,T[0])}else{for(let x=11;x<=15;x++)set(g,x,21,P.leather[1])}
  const r=unit(o);for(let y=0;y<=12;y++)for(let x=0;x<16;x++){const c=r.p[y*16+x];if(c&&c!==OUT)set(g,x+6,y+9,c)}
  set(g,11,22,letter('L',o));set(g,11,23,letter('L',o));set(g,11,24,letter('F',o));
  outline(g);return g;
}
function draw(g,k){const c=document.createElement('canvas');c.width=g.w*k;c.height=g.h*k;const x=c.getContext('2d');for(let y=0;y<g.h;y++)for(let i=0;i<g.w;i++){const p=g.p[y*g.w+i];if(p){x.fillStyle=p;x.fillRect(i*k,y*k,k,k)}}return c}
const U=[
  ['Levy',{helm:'cap',outer:'leather',inner:'dark',team:'blue',weapon:'spear',hair:'brown',shortHair:true}],
  ['Spearman',{helm:'cap',outer:'steel',inner:'dark',team:'blue',weapon:'spear',shield:true,hair:'blond',shortHair:true}],
  ['Man-at-arms',{helm:'great',outer:'steel',inner:'dark',team:'blue',weapon:'sword',shield:true,shieldC:'steel'}],
  ['Bowman',{helm:'hood',hood:'olive',outer:'olive',inner:'dark',team:'blue',weapon:'bow',hair:'brown'}],
  ['Mage',{helm:'wizard',outer:'violet',inner:'dark',team:'blue',weapon:'staff',robe:true,beard:'grey',hair:'grey'}],
  ['Knight',{helm:'plume',outer:'steel',inner:'dark',team:'blue',weapon:'sword',shield:true,shieldC:'steel'}],
  ['Hero',{helm:'crown',outer:'steel',inner:'dark',team:'blue',weapon:'sword',hair:'blond'}],
  ['Priestess',{outer:'white',inner:'cloth',team:'teal',weapon:'staff',robe:true,hair:'blond'}],
  ['Dwarf',{helm:'horned',outer:'steel',inner:'dark',team:'red',weapon:'axe',shield:true,shieldC:'orange',beard:'ginger',hair:'ginger'}],
  ['Elf',{ears:true,outer:'olive',inner:'dark',team:'olive',weapon:'bow',hair:'blond'}],
  ['Orc',{skin:'orc',helm:'horned',outer:'leather',inner:'dark',team:'red',weapon:'bigaxe',tusk:true,hair:'black',eye:'#ffdc04'}],
  ['Villager',{outer:'cloth',inner:'cloth',team:'orange',hair:'brown',legs:'leather',shortHair:true}]
];
const add=(p,c,l)=>{const d=document.createElement('div');d.className='cell';d.appendChild(c);if(l){const s=document.createElement('span');s.textContent=l;d.appendChild(s)}p.appendChild(d)};
const sec=t=>{const h=document.createElement('h3');h.textContent=t;document.body.appendChild(h);const r=document.createElement('div');r.className='row';document.body.appendChild(r);return r};
let r=sec('Ours · the same template in a 16×16 cell · 4×');for(const [n,o] of U)add(r,draw(unit(o),4),n);
r=sec('The other side');for(const [n,o] of U.slice(0,7))add(r,draw(unit({...o,team:'red'}),4),n);
r=sec('Mounted · 32×32 · the same rider · 4×');add(r,draw(mounted(U[1][1]),4),'Spearman');add(r,draw(mounted({...U[5][1],horse:'horseW',caparison:true}),4),'Knight, barded');add(r,draw(mounted({...U[5][1],team:'red',caparison:true,horse:'horseB'}),4),'Enemy knight');
r=sec('At play size · 1×, 2×, 3×');
for(const k of [1,2,3]){const f=document.createElement('div');f.className='field';const c=document.createElement('canvas');c.width=(U.length*12+40)*k;c.height=34*k;const x=c.getContext('2d');let px=2;
  for(const [n,o] of U){x.drawImage(draw(unit(o),k),px*k,17*k);px+=12}x.drawImage(draw(mounted({...U[5][1],horse:'horseW',caparison:true}),k),px*k,1*k);f.appendChild(c);r.appendChild(f)}
</script>
</body></html>
