<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portrait integration example</title><style>
*{box-sizing:border-box}body{margin:0;background:#17201e;color:#e8e6dc;font:15px/1.5 Arial}main{max-width:1100px;margin:auto;padding:24px}h1{font:30px Georgia;margin:0 0 10px}p{color:#aebbb3}button,input{font:inherit;min-height:44px;padding:8px 12px;color:inherit;background:#2b3932;border:1px solid #637565;border-radius:5px}input{max-width:140px}nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.card{padding:10px;border:1px solid #53614f;background:#26302b;border-radius:5px;min-width:0}.player{border-color:#d4be7f}canvas{width:100%;height:auto;image-rendering:pixelated;display:block}small{overflow-wrap:anywhere}#status{color:#d4be7f}a{color:#d4be7f}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style><main><h1>Player recipe + persistent world portraits</h1><p>This example uses the same two engine scripts your game can load. Import a player recipe from the <a href="../portrait-workshop-grayscale.html">character studio</a>, then create a world. Re-rendering and save/load keep existing NPC faces.</p><nav><label>World seed <input id="seed" type="number" value="71" min="0" max="4294967295"></label><button id="create">Create world</button><button id="rerender">Re-render existing characters</button><button id="load-player">Load player recipe</button><input id="player-file" type="file" accept="application/json,.json" hidden><button id="save">Export world portraits</button><button id="load">Load world portraits</button><input id="world-file" type="file" accept="application/json,.json" hidden></nav><p id="status" role="status"></p><section id="portraits" class="grid"></section></main><script src="../portrait-engine.js"></script><script src="../portrait-generation.js"></script><script>
'use strict';
const E=PortraitEngine,C=PortraitCharacters,$=id=>document.getElementById(id);let player=C.recipe({config:E.startProfile('male'),colors:E.colors}),roster;
function draw(){const target=$('portraits');target.replaceChildren();const card=(image,label,isPlayer=false)=>{const a=document.createElement('article'),text=document.createElement('small');a.className='card'+(isPlayer?' player':'');text.textContent=label;a.append(image,text);target.append(a);};card(E.composite(E.build(roster.player.config),{colors:roster.player.colors}),'Player · reserved',true);for(const record of roster.export().characters){const source=roster.portrait(record.id),canvas=document.createElement('canvas');canvas.width=canvas.height=128;canvas.getContext('2d').drawImage(source,0,0);card(canvas,record.id+' · '+record.config.race);} $('status').textContent='Saved '+roster.export().characters.length+' distinct NPC recipes. Draw calls reuse cached portraits.';}
function create(){roster=new C.Roster({seed:Number($('seed').value),player});for(let i=0;i<8;i++)roster.create({id:'lord-'+String(i+1).padStart(3,'0'),race:E.races[i%4],role:'lord',mode:'mixed'});draw();}
function act(fn){try{fn();}catch(e){$('status').textContent=e.message;}}
$('create').onclick=()=>act(create);$('rerender').onclick=()=>act(draw);$('save').onclick=()=>act(()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(roster.export(),null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='world-portraits-v7.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});$('load-player').onclick=()=>$('player-file').click();$('load').onclick=()=>$('world-file').click();
$('player-file').onchange=async()=>{try{const file=$('player-file').files[0];if(!file)return;if(file.size>100000)throw Error('Player recipe is too large.');const data=JSON.parse(await file.text());if(!data.config||![4,5,6,7].includes(data.version))throw Error('Choose an exported player recipe.');player=C.recipe(data);create();}catch(e){$('status').textContent=e.message;}finally{$('player-file').value='';}};
$('world-file').onchange=async()=>{try{const file=$('world-file').files[0];if(!file)return;if(file.size>5000000)throw Error('World portrait save is too large.');roster=C.Roster.restore(JSON.parse(await file.text()));player=roster.player;$('seed').value=roster.seed;draw();}catch(e){$('status').textContent=e.message;}finally{$('world-file').value='';}};
create();window.integrationExample={get roster(){return roster;}};
</script></html>
