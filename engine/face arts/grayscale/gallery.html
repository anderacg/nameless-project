<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ashmark · Faces of the realm</title><style>
*{box-sizing:border-box}body{margin:0;background:#171717;color:#e7e7e7;font:14px Arial,sans-serif}main{width:1208px;padding:28px;margin:0 auto}.eyebrow{font-size:11px;letter-spacing:3px;color:#bcbcbc}h1{font:36px Georgia,serif;margin:12px 0 10px}header p{font-size:14px;color:#a8a8a8;margin:0 0 25px}.grid{display:grid;grid-template-columns:repeat(4,270px);gap:24px}.card{padding:6px;border:1px solid #505050;border-radius:5px;background:#252525}.card canvas{width:256px;height:256px;display:block;image-rendering:pixelated;background:radial-gradient(ellipse,#3c3c3c,#292929 80%)}h2{font:18px Georgia,serif;margin:12px 8px 7px}.card p{margin:0 8px 12px;font-size:11px;color:#aaa;line-height:1.5;min-height:33px}footer{font-size:12px;color:#999;margin-top:22px}@media(max-width:700px){main{width:600px;padding:22px}.grid{grid-template-columns:repeat(2,270px);gap:16px}h1{font-size:32px}}
</style><main><header><div class="eyebrow">ASHMARK · PROCEDURAL PORTRAIT WORKSHOP</div><h1>Faces of the realm.</h1><p>Medieval characters with separate grayscale layers, assembled by the portrait engine.</p></header><section class="grid"></section><footer>128 × 128 source portraits · shared facial alignment · clothing, mail and headwear remain separate tintable layers</footer></main><script src="portrait-engine.js"></script><script>
const E=PortraitEngine;
for(const preset of E.presets){const card=document.createElement('article');card.className='card';const h=document.createElement('h2'),p=document.createElement('p');h.textContent=preset.name;p.textContent=[preset.config.clothing,preset.config.headwear==='none'?preset.config.hair:preset.config.headwear,preset.config.age].map(s=>s.charAt(0).toUpperCase()+s.slice(1)).join(' · ');card.append(E.composite(E.build(preset.config)),h,p);document.querySelector('.grid').append(card);}
</script></html>
