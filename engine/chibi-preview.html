<!doctype html>
<html><head><meta charset="utf-8"><title>Chibi sprites</title>
<style>
body{margin:0;background:#232634;color:#e4e0cf;font:14px monospace;padding:16px}
h3{margin:14px 0 6px;color:#e8b94a;font-weight:400;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.row{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px}
.cell span{font-size:11px;color:#9aa3ad}
canvas{image-rendering:pixelated}
.field{background:#4f7a3a;padding:10px;display:inline-block;border:2px solid #2a3a22}
</style></head><body>
<script>
'use strict';
// a sprite grid and its drawing
const G=(w,h)=>({w,h,p:new Array(w*h).fill(null)});
const set=(g,x,y,c)=>{x|=0;y|=0;if(x>=0&&y>=0&&x<g.w&&y<g.h)g.p[y*g.w+x]=c};
const get=(g,x,y)=>x>=0&&y>=0&&x<g.w&&y<g.h?g.p[y*g.w+x]:null;
const rect=(g,x,y,w,h,c)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++)set(g,x+i,y+j,c)};
const ell=(g,cx,cy,rx,ry,c)=>{for(let y=Math.floor(cy-ry);y<=cy+ry;y++)for(let x=Math.floor(cx-rx);x<=cx+rx;x++)if(((x+.5-cx)/rx)**2+((y+.5-cy)/ry)**2<=1)set(g,x,y,c)};
// shaded: dark everywhere, mid shifted up-left, a light spot up-left (a ramp: [light, mid, dark])
const sEll=(g,cx,cy,rx,ry,R)=>{ell(g,cx,cy,rx,ry,R[2]);ell(g,cx-.6,cy-.6,rx-.8,ry-.8,R[1]);ell(g,cx-rx*.35,cy-ry*.4,rx*.35,ry*.3,R[0])};
const sRect=(g,x,y,w,h,R)=>{rect(g,x,y,w,h,R[1]);rect(g,x+w-1,y,1,h,R[2]);rect(g,x,y+h-1,w,1,R[2]);rect(g,x,y,w-1,1,R[0]);rect(g,x,y,1,h-1,R[0])};
const line=(g,x0,y0,x1,y1,c)=>{const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0));for(let i=0;i<=n;i++)set(g,Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),c)};
// the outline: every empty pixel touching a filled one
function outline(g,c){const o=[];for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++)if(!get(g,x,y)&&(get(g,x-1,y)||get(g,x+1,y)||get(g,x,y-1)||get(g,x,y+1)))o.push([x,y]);for(const [x,y] of o)set(g,x,y,c)}
const stamp=(dst,src,ox,oy)=>{for(let y=0;y<src.h;y++)for(let x=0;x<src.w;x++){const c=src.p[y*src.w+x];if(c)set(dst,ox+x,oy+y,c)}};
// palettes
const RAMP={
  skin:['#ffd8b0','#f0b088','#c07a58'],steel:['#f2f6fc','#b8c4d6','#6a7892'],dark:['#8a94a8','#4a5468','#2a3040'],
  leather:['#d09a62','#9a6438','#62401f'],wood:['#c89a5a','#8a5a2a','#5a3a1a'],gold:['#fff0a0','#e8b94a','#a8701e'],
  hairB:['#a06a3a','#6a4020','#3a2010'],hairW:['#ffffff','#d8dce6','#9aa0b0'],red:['#ff8a7a','#d8403a','#8a1a1a'],
  blue:['#9cc8ff','#3d74d6','#1e3a80'],redT:['#ffa090','#c8403a','#7a1a1a'],green:['#a8e08a','#4a9a3a','#245a1e'],
  horse:['#c8905a','#8a5a32','#4a2e18'],horseW:['#ffffff','#d8d0c0','#9a9080'],mane:['#5a3a20','#3a2410','#1e120a'],purple:['#d0a0ff','#7a4ac0','#3e2470']
};
const OUT='#16101c';
// a chibi: big head, small body (32×32, standing on y 30; facing right). o: helm, armor, team, shield, weapon, cape, seated
function chibi(o){
  const g=G(32,32),T=RAMP[o.team||'blue'],A=RAMP[o.armor==='mail'?'steel':o.armor||'steel'],HM=RAMP.steel,seat=o.seated;
  // cape behind
  if(o.cape){sRect(g,7,15,6,seat?8:13,[T[1],T[2],T[2]]);set(g,7,seat?22:27,T[2]);set(g,9,seat?23:28,T[2])}
  // legs and boots
  if(!seat){sRect(g,11,24,3,4,A);sRect(g,16,24,3,4,A);sRect(g,10,27,5,3,RAMP.leather);sRect(g,15,27,5,3,RAMP.leather)}
  else{sRect(g,13,23,7,3,A);sRect(g,18,24,3,4,RAMP.leather)}
  // shield (back hand)
  if(o.shield==='round'){sEll(g,10,19.5,4.5,4.5,o.shieldR||RAMP.wood);ell(g,10,19.5,2,2,T[1]);set(g,10,19,RAMP.gold[1])}
  // torso: armor, the team's tabard, a belt
  sRect(g,10,15,11,10,A);sRect(g,13,16,5,9,T);rect(g,10,22,11,1,RAMP.leather[2]);rect(g,15,22,1,1,RAMP.gold[1]);
  if(o.armor==='mail'){for(let y=16;y<22;y+=2)for(let x=11;x<20;x+=2)if(x<13||x>17)set(g,x,y,A[2])}
  // shoulder pauldrons
  sEll(g,10.5,16,2.6,2,o.armor==='leather'?RAMP.leather:HM);sEll(g,20.5,16,2.6,2,o.armor==='leather'?RAMP.leather:HM);
  // the head
  sEll(g,15.5,9.5,7.2,6.6,RAMP.skin);
  const H=o.hair||RAMP.hairB;
  if(o.helm==='great'||o.helm==='plume'){sEll(g,15.5,9,7.6,7,HM);rect(g,13,9,9,2,OUT);set(g,20,12,HM[2]);set(g,18,12,HM[2]);rect(g,15,3,1,6,HM[0]);
    if(o.helm==='plume'){sEll(g,13,2.5,4,2.2,RAMP.red);sEll(g,9.5,3.5,2.5,1.8,RAMP.red)}}
  else if(o.helm==='kettle'){sEll(g,15.5,5.5,6,4,HM);sRect(g,6,7,20,2,HM);ell(g,18,11,1,1.4,OUT);ell(g,21,11,1,1.4,OUT);set(g,14,10,H[1]);set(g,13,11,H[1])}
  else if(o.helm==='hood'){const C=o.hood||RAMP.green;sEll(g,14.5,9,8,7.2,C);ell(g,18.5,11,4,3.6,RAMP.skin[1]);ell(g,19,10.5,3,2.6,RAMP.skin[0]);ell(g,18,11,.8,1.3,OUT);ell(g,21,11,.8,1.3,OUT);set(g,8,13,C[2]);set(g,7,14,C[2])}
  else if(o.helm==='wizard'){const C=RAMP.purple;sEll(g,14,8,8,5,C);line(g,10,4,6,-1,C[1]);line(g,11,4,7,0,C[1]);line(g,9,4,6,0,C[2]);sRect(g,6,7,19,2,C);ell(g,18.5,11.5,3.6,3,RAMP.skin[1]);ell(g,18,11,.8,1.3,OUT);ell(g,21,11,.8,1.3,OUT);rect(g,15,14,6,3,RAMP.hairW[1])}
  else{// hair, a fringe, eyes
    sEll(g,14.5,6.5,7.4,4.2,H);rect(g,8,7,3,6,H[1]);set(g,9,13,H[2]);rect(g,16,6,6,2,H[1]);set(g,22,8,H[2]);
    ell(g,18,11,1,1.6,OUT);ell(g,21,11,1,1.6,OUT);set(g,18,10,'#ffffff');set(g,21,10,'#ffffff');set(g,19,13,RAMP.skin[2]);
    if(o.helm==='crown'){rect(g,10,3,10,2,RAMP.gold[1]);rect(g,10,3,10,1,RAMP.gold[0]);set(g,10,2,RAMP.gold[1]);set(g,14,1,RAMP.gold[1]);set(g,14,2,RAMP.gold[1]);set(g,19,2,RAMP.gold[1]);set(g,14,4,RAMP.red[1])}}
  // the front hand and its weapon
  const hx=22,hy=20;
  if(o.weapon==='sword'){rect(g,hx+1,5,2,13,RAMP.steel[1]);rect(g,hx+1,5,1,13,RAMP.steel[0]);set(g,hx+2,4,RAMP.steel[1]);rect(g,hx-1,18,6,1,RAMP.gold[1]);rect(g,hx+1,19,2,3,RAMP.leather[1]);set(g,hx+1,22,RAMP.gold[1])}
  if(o.weapon==='spear'||o.weapon==='lance'){const top=o.weapon==='lance'?-4:0;rect(g,hx+1,top+4,1,27-top-4,RAMP.wood[1]);rect(g,hx+2,top+4,1,27-top-4,RAMP.wood[2]);
    if(o.weapon==='spear'){ell(g,hx+1.5,3,1.6,3,RAMP.steel[1]);set(g,hx+1,1,RAMP.steel[0])}else{rect(g,hx,0,4,6,T[1]);set(g,hx+3,6,T[2])}}
  if(o.weapon==='axe'){rect(g,hx+1,9,1,16,RAMP.wood[1]);sEll(g,hx+4,11,3,3.5,RAMP.steel);rect(g,hx+1,9,2,1,RAMP.steel[2])}
  if(o.weapon==='bow'){for(let y=6;y<=28;y++){const t=(y-17)/11,x=Math.round(hx+3-4*(1-t*t));set(g,x,y,RAMP.wood[1]);set(g,x+1,y,RAMP.wood[2])}line(g,hx+3,6,hx+3,28,'#e8e4d0')}
  if(o.weapon==='staff'){rect(g,hx+1,4,1,25,RAMP.wood[1]);ell(g,hx+1.5,3,2.4,2.4,RAMP.purple[0]);set(g,hx+1,2,'#ffffff')}
  sEll(g,hx,hy,2,2,RAMP.skin);// (the hand over the grip)
  // the kite shield over the body
  if(o.shield==='kite'){const S=o.shieldR||RAMP.steel;for(let y=0;y<11;y++){const w=y<6?6:Math.max(1,6-(y-5)*1.2);rect(g,Math.round(10-w/2+1),15+y,Math.round(w),1,y<6?S[1]:S[2])}rect(g,7,15,7,1,S[0]);rect(g,10,16,1,7,T[1]);rect(g,8,18,5,1,T[1])}
  outline(g,OUT);return g;
}
// a horse, its caparison, and a seated rider (64×64; the horse stands on y 60)
function rider(o){
  const g=G(64,64),H=RAMP[o.horse||'horse'],T=RAMP[o.team||'blue'],M=RAMP.mane;
  // tail, legs (far ones darker), body, neck, head
  for(let i=0;i<9;i++)set(g,14-i*.3,36+i,M[i%2]),set(g,15-i*.3,36+i,M[1]);
  const leg=(x,dark)=>{const R=dark?[H[1],H[2],H[2]]:H;sRect(g,x,48,3,9,R);rect(g,x,57,3,2,OUT==='x'?0:'#2a1e14')};
  leg(20,true);leg(37,true);leg(23,false);leg(40,false);
  sEll(g,31,42,15,8,H);
  // a neck that leans forward, a long head, the muzzle low, ears up
  for(let i=0;i<9;i++)ell(g,42+i*1.1,39-i*1.2,4.4-i*.15,4,H[1]);
  for(let i=0;i<9;i++)ell(g,41.4+i*1.1,38.4-i*1.2,3.2-i*.15,3,H[0]);
  sEll(g,53,29,6.5,3.8,H);ell(g,58.5,31,2.6,2.4,H[1]);set(g,60,31,OUT);ell(g,54,27.5,1,1.1,OUT);
  rect(g,49,23,2,4,H[1]);set(g,49,22,H[2]);rect(g,51,24,2,3,H[2]);
  for(let i=0;i<10;i++){set(g,40+i*1.15,35.5-i*1.2,M[1]);set(g,39+i*1.15,35.5-i*1.2,M[2]);set(g,40+i*1.15,34.5-i*1.2,M[0])}
  // caparison: the team's cloth over its back, with a fringe
  if(o.caparison){sRect(g,18,36,26,10,T);for(let x=18;x<44;x+=3)set(g,x,46,T[2]);rect(g,18,38,26,1,RAMP.gold[1])}
  else{sRect(g,26,35,10,6,RAMP.leather)}// (a saddle)
  // reins
  line(g,40,36,55,31,RAMP.leather[2]);
  // the rider on its back
  const r=chibi({...o,seated:true});stamp(g,r,16,8);
  outline(g,OUT);return g;
}
// on a canvas, k times over
function draw(g,k,bg){const c=document.createElement('canvas');c.width=g.w*k;c.height=g.h*k;const x=c.getContext('2d');if(bg){x.fillStyle=bg;x.fillRect(0,0,c.width,c.height)}
  for(let y=0;y<g.h;y++)for(let i=0;i<g.w;i++){const p=g.p[y*g.w+i];if(p){x.fillStyle=p;x.fillRect(i*k,y*k,k,k)}}return c}
const UNITS=[
  ['Levy',{helm:'kettle',armor:'leather',weapon:'spear'}],
  ['Spearman',{helm:'kettle',armor:'mail',weapon:'spear',shield:'round'}],
  ['Man-at-arms',{helm:'great',armor:'steel',weapon:'sword',shield:'kite'}],
  ['Axeman',{helm:'great',armor:'mail',weapon:'axe',shield:'round'}],
  ['Bowman',{helm:'hood',armor:'leather',weapon:'bow'}],
  ['Mage',{helm:'wizard',armor:'leather',weapon:'staff',team:'purple'}],
  ['Knight',{helm:'plume',armor:'steel',weapon:'sword',shield:'kite',cape:true}],
  ['Hero',{helm:'crown',armor:'steel',weapon:'sword',cape:true,hair:RAMP.hairB}]
];
const add=(parent,c,label)=>{const d=document.createElement('div');d.className='cell';d.appendChild(c);if(label){const s=document.createElement('span');s.textContent=label;d.appendChild(s)}parent.appendChild(d)};
const sec=(t)=>{const h=document.createElement('h3');h.textContent=t;document.body.appendChild(h);const r=document.createElement('div');r.className='row';document.body.appendChild(r);return r};
let r=sec('Foot · 32×32 cell · shown 4×');for(const [n,o] of UNITS)add(r,draw(chibi({...o,team:o.team||'blue'}),4),n);
r=sec('Cavalry · 64×64 cell · shown 3×');add(r,draw(rider({helm:'kettle',armor:'mail',weapon:'spear',team:'blue'}),3),'Horseman');add(r,draw(rider({helm:'plume',armor:'steel',weapon:'lance',team:'blue',caparison:true,cape:true,horse:'horseW'}),3),'Knight (barded)');
add(r,draw(rider({helm:'great',armor:'steel',weapon:'lance',team:'redT',caparison:true,horse:'horse'}),3),'Enemy lancer');
r=sec('The other side · red');for(const [n,o] of UNITS.slice(0,7))add(r,draw(chibi({...o,team:o.team==='purple'?'purple':'redT'}),4),n);
// at the game's own scale, on grass: 1× and 2×
r=sec('In the field · 1× and 2×');for(const k of [1,2]){const f=document.createElement('div');f.className='field';const c=document.createElement('canvas'),W=k*260,Hh=k*72;c.width=W;c.height=Hh;const x=c.getContext('2d');
  const put=(g,px,py)=>x.drawImage(draw(g,k),px*k,py*k);let px=4;for(const [n,o] of UNITS){put(chibi({...o}),px,36);px+=26}put(rider({helm:'plume',armor:'steel',weapon:'lance',team:'blue',caparison:true,horse:'horseW'}),px-6,4);
  f.appendChild(c);r.appendChild(f)}
</script>
<pre id="OUT" style="display:none">PASS</pre>
</body></html>
