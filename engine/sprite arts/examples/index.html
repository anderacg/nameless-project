<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprite Studio lineup</title><style>*{box-sizing:border-box}body{margin:0;background:#15211b;color:#e6e0ce;font:14px Arial}main{max-width:1050px;padding:25px;margin:auto}h1{font:29px Georgia;margin:0 0 9px}p{color:#a9baac;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{padding:12px;background:#24332a;border:1px solid #4a604f}.card canvas{width:100%;height:auto;display:block;image-rendering:pixelated}.card strong{display:block;margin-top:8px}.card small{color:#b5c1b4}a{color:#d0b877}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><main><h1>Character Sprite Studio</h1><p>Actual game-rendered figures · four races · editable equipment and grayscale material channels</p><div class="grid"></div><p style="margin-top:20px"><a href="../sprite-workshop.html">Open the workshop</a></p></main><script src="../../pixel.js"></script><script src="../../doll.js"></script><script src="../runtime.js"></script><script src="../../../prototype/js/data/units.js"></script><script src="../../../prototype/js/gfx/sprites.js"></script><script src="../../../prototype/js/gfx/people.js"></script><script src="../../../prototype/js/gfx/figures.js"></script><script src="../../../prototype/js/gfx/dollfigs.js"></script><script src="../../../prototype/js/gfx/weapons.js"></script><script src="../sprite-engine.js"></script><script>
const E=SpriteStudio;
for(const id of ['hero','spearman','archer','mage'])for(const race of ['human','dwarf','elf','orc']){const preset=E.presets.find(p=>p.id===id),config=E.normalize({...preset.config,race,skin:PX.DOLL.RACES[race].skin,beard:race==='dwarf',hair:race==='dwarf'?'ginger':race==='elf'?'blond':'brown'}),image=E.render(config,{renderer:'game',pose:'idle'}).image,card=document.createElement('article'),name=document.createElement('strong'),note=document.createElement('small');card.className='card';name.textContent=race.charAt(0).toUpperCase()+race.slice(1)+' · '+preset.name;note.textContent=image.width+' × '+image.height+' frame';card.append(image,name,note);document.querySelector('.grid').append(card);}
</script></html>
