<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PX Gallery</title>
<style>
  :root{--bg:#1a1d26;--fg:#e4e0cf;--muted:#9a958a}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;padding:12px}
  h1{font-size:18px;margin:0 0 4px}p{margin:0 0 10px;color:var(--muted)}
  .row{display:flex;align-items:flex-end;gap:6px;margin:0 0 6px}.lab{width:110px;color:var(--muted);font-size:12px;align-self:center}
  canvas{image-rendering:pixelated}
  label{margin-right:12px}
</style></head><body>
<h1>PX building gallery</h1>
<p>Every building type, by people, across seeds. <label>Zoom <input id="z" type="number" value="3" min="1" max="8" style="width:48px"></label> <label>Seeds <input id="n" type="number" value="8" min="1" max="20" style="width:48px"></label> <label>Only <input id="only" placeholder="type or people" style="width:140px"></label></p>
<div id="out"></div>
<script src="pixel.js"></script>
<script src="buildings.js"></script>
<script src="pieces.js"></script>
<script src="ground.js"></script>
<script src="ground-fixture.js"></script>
<script src="worldnature.js"></script>
<script src="beasts.js"></script>
<script>
// which types each people builds (the same list the game's settlements use)
const PEOPLE={human:['cottage','townhouse','fisherhut','chapel','stall','tower','longhouse','tavern','smithy','church','barn','granary','windmill','watermill','warehouse','gatehouse','keep','citadel'],
  dwarf:['cottage','townhouse','tower','stonehall','forge','granary','gatehouse','keep','citadel'],elf:['cottage','stall','tower','treehouse','elfhall','spire','keep','citadel'],orc:['yurt','cottage','stall','tower','hidehall','watchtower','smithy','keep','citadel'],
  villages:['village'],
  works:['well','tent','wagon','minehead','lumbershed','crane'],sites:['cave','ruins','shrine']};
function render(){
  const q0=new URLSearchParams(location.search);
  if(new URLSearchParams(location.search).get('view')==='props')return renderProps();
  if(q0.get('view')==='beasts')return renderBeasts();
  if(q0.get('view')==='ground')return renderGround();
  if(q0.get('view')==='depth')return renderDepth();
  if(q0.get('view')==='bench')return renderBench();
  if(q0.get('view')==='nature')return renderNature();
  if(new URLSearchParams(location.search).get('view')==='castles'){const out=document.getElementById('out');out.innerHTML='';for(const type of ['keep','citadel','village','longhouse','stonehall','elfhall','hidehall'])for(const style of ['human','dwarf','elf','orc']){if(['stonehall','elfhall','hidehall','longhouse'].includes(type)&&style!==({longhouse:'human',stonehall:'dwarf',elfhall:'elf',hidehall:'orc'})[type])continue;const row=document.createElement('div');row.className='row';row.innerHTML='<span class="lab">'+style+' · '+type+'</span>';for(let s=1;s<=6;s++){const hall=!['keep','citadel'].includes(type),b=PX.building({type,style,seed:s*37+type.length,view:'top',fort:hall?(s>3?1:0):[0,1,2,3,1,2][s-1],banner:'#c84040'}),Z=+(q0.get('z')||3),c=document.createElement('canvas'),M=4,w=b.w+2*M;c.width=w*Z;c.height=w*Z;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.scale(Z,Z);g.fillStyle='#5a8a3a';g.fillRect(0,0,w,w);g.fillStyle='rgba(0,0,0,.18)';for(let k=0;k<=b.tiles[0];k++){g.fillRect(M+k*16,0,1,w);g.fillRect(0,M+k*16,w,1)}g.fillStyle='rgba(255,230,120,.5)';g.fillRect(M+b.w/2,M+b.h,1,M);g.fillRect(M+b.w/2-1,M+b.h,1,M);g.drawImage(b.img,M,M);if(b.flag){const fx=M+b.flag[0],fy=M+b.flag[1],fc=['#c84040','#4a72b0','#3a8a4a','#d8a030'][s%4];g.fillStyle='#4a3020';g.fillRect(fx,fy-9,1,9);g.fillStyle=fc;g.fillRect(fx+1,fy-9,4,3)}row.appendChild(c)}out.appendChild(row)}return}
  const q=new URLSearchParams(location.search),Z=+(document.getElementById('z').value||q.get('z')||3),N=+(document.getElementById('n').value||q.get('n')||8),only=(document.getElementById('only').value||q.get('only')||'').trim();
  const out=document.getElementById('out');out.innerHTML='';
  for(const style in PEOPLE)for(const type of PEOPLE[style]){if(only&&only!==type&&only!==style)continue;
    const row=document.createElement('div');row.className='row';row.innerHTML='<span class="lab">'+style+' · '+type+'</span>';
    for(let s=1;s<=N;s++){const vw=q.get('view'),b=(PX.SITE_TYPES.includes(type)?PX.site:PX.building)({type,style,seed:s*37+type.length,env:['grass','frost','desert','swamp'][s%4],banner:['#c84040','#4a72b0','#3a8a4a','#d8a030'][s%4],view:vw==='top'||vw==='angled'?vw:undefined});
      // the building in its square cell, on the tile grid (a faint line every 16 px, a stronger one round the cell)
      const c=document.createElement('canvas'),M=4,tw=b.w+2*M,th=b.h+2*M;c.width=tw*Z;c.height=th*Z;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.scale(Z,Z);
      g.fillStyle='#5a8a3a';g.fillRect(0,0,tw,th);g.fillStyle='rgba(0,0,0,.18)';for(let k=0;k<=b.tiles[0];k++){g.fillRect(M+k*16,0,1,th);g.fillRect(0,M+k*16,tw,1)}
      g.fillStyle='rgba(255,240,200,.35)';g.fillRect(M,M,b.w,1);g.fillRect(M,M+b.h-1,b.w,1);g.fillRect(M,M,1,b.h);g.fillRect(M+b.w-1,M,1,b.h);
      g.drawImage(b.shadow,M,M);g.drawImage(b.img,M,M);if(b.clipped){g.fillStyle='#e0605a';g.fillRect(0,0,3,3)}row.appendChild(c)}
    row.querySelector('.lab').textContent+=' · '+((PX.SITE_TYPES.includes(type)?PX.site:PX.building)({type,style,seed:1}).w)+'px';
    out.appendChild(row)}
}
// battlefield ground (engine/ground.js) on stand-in terrain (ground-fixture.js): each recipe in each climate, a field 960×600 at
// 1:1 (?z=2 doubles it); ?only= a recipe, a climate, 'rivers' or 'rock' (phase 4: mountains, cliffs and ramps); &c= one climate;
// ?seed= the fixture's seed
function renderGround(){
  const q=new URLSearchParams(location.search),Z=+(q.get('z')||1),only=q.get('only')||'',sd=+(q.get('seed')||1),out=document.getElementById('out');out.innerHTML='';
  // (rivers: ?only=rivers shows each river recipe in the climates that have one; a desert gets a river only when the game lays one)
  const RIVERS=['river','bridge','fords','bridgehills','stream','frozen','mountriver'],riv=only==='rivers',ROCK=['spires','plateau','cliffs','mountriver'],rk=only==='rock',cl=q.get('c');
  for(const recipe of ['hills','forest','marsh','mixed','hillwoods','oasis',...RIVERS,'spires','plateau','cliffs'])for(const climate of ['grass','frost','desert','swamp']){if(rk?!ROCK.includes(recipe):riv?!RIVERS.includes(recipe)||climate==='desert':only&&only!==recipe&&only!==climate)continue;
    if(RIVERS.includes(recipe)&&climate==='desert'&&only!==recipe)continue;if(cl&&cl!==climate)continue;
    const t=PX.groundFixture({recipe,C:60,R:38,seed:sd}),t0=performance.now(),gr=PX.battleGround({...t,climate}),ms=performance.now()-t0,mini=PX.battleGroundMini({...t,climate},gr);
    const row=document.createElement('div');row.className='row';row.innerHTML='<span class="lab">'+recipe+' · '+climate+' · '+ms.toFixed(0)+' ms · props '+[1,2,3].map(k=>gr.props.filter(p=>p.dk===k).length).join('/')+'</span>';
    const c=document.createElement('canvas');c.width=gr.width*Z;c.height=gr.height*Z;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.scale(Z,Z);g.drawImage(gr,0,0);PX.battleProps(g,gr);row.appendChild(c);// (its standing trees and cliff faces in their order: in the game, sorted in with the soldiers)
    const m=document.createElement('canvas');m.width=mini.width*3;m.height=mini.height*3;const mg=m.getContext('2d');mg.imageSmoothingEnabled=false;mg.drawImage(mini,0,0,m.width,m.height);row.appendChild(m);
    out.appendChild(row)}
}
// phase 4 depth: stand-in soldiers (yours blue, the enemy red) in front of and behind a spire, the massif and a cliff, drawn in
// one list with the ground's props by their feet as render.js battleEnts does; a prop over one of yours behind it fades to .4
// (render.js PROPFADE), none over the enemy. Each crop twice: no fade, then with it. ?c= the climate, &seed=
const FIG=['......112.......','.....12232......','.....2s3s3......','.....1sexe......','.....1ttxt......','.....12uu2......','....a2pqq2d.....','...abpqqrcd.....','...bcpnnrcd.....','...bspnnrsd.....','...bcqoorcd.....','...bckllkcd.....','.....LL.LM......','.....F...F......'];
function figure(team){const T=team?['#d05a4a','#a83a34','#7a2a2a','#5a1e22']:['#5a86d0','#3a62a8','#2a467a','#1e3058'],col={1:'#4a3020',2:'#6a4428',3:'#2e1e14',s:'#e0b088',x:'#c08a68',t:'#d09c78',u:'#a87458',e:'#202028',a:T[1],b:T[2],c:T[2],d:T[3],p:T[0],q:T[0],r:T[1],n:'#c8c0a8',o:'#a89e88',k:'#5a3a22',l:'#3a2a1a',L:'#4a4038',M:'#3a3028',F:'#2a2018'};
  return PX.canvas(16,16,g=>{for(let y=0;y<14;y++)for(let x=0;x<16;x++){const ch=FIG[y][x];if(ch!=='.'){g.fillStyle=col[ch];g.fillRect(x,y+1,1,1)}}
    const d=g.getImageData(0,0,16,16).data,o=[],a=(u,v)=>u>=0&&v>=0&&u<16&&v<16&&d[(v*16+u)*4+3];for(let y=0;y<16;y++)for(let x=0;x<16;x++)if(!a(x,y)&&(a(x-1,y)||a(x+1,y)||a(x,y-1)||a(x,y+1)))o.push([x,y]);
    g.fillStyle='#1a1c26';for(const [x,y] of o)g.fillRect(x,y,1,1)})}
function scene(gr,men,fade){const c=PX.canvas(gr.width,gr.height),g=c.getContext('2d'),F0=figure(0),F1=figure(1);g.drawImage(gr,0,0);
  for(const p of gr.props){p.al=1;if(!fade)continue;for(const u of men){if(u.team)continue;const b=p.box;if(u.x+5<b[0]||u.x-5>b[2]||u.y-1<b[1]||u.y-15>b[3])continue;if(u.y<p.y){p.al=.4;break}}}
  for(const o of [...gr.props,...men].sort((a,b)=>a.y-b.y)){if(o.dk){g.globalAlpha=o.al;g.drawImage(o.s,o.dx,o.dy);g.globalAlpha=1}else{g.fillStyle='rgba(8,14,24,.3)';g.fillRect(o.x-3,o.y,7,1);g.drawImage(o.team?F1:F0,o.x-8,o.y-15)}}
  return c}
function crop(src,x,y,w,h,Z){const c=document.createElement('canvas');c.width=w*Z;c.height=h*Z;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(src,x,y,w,h,0,0,w*Z,h*Z);return c}
function renderDepth(){const q=new URLSearchParams(location.search),climate=q.get('c')||'grass',sd=+(q.get('seed')||1),Z=+(q.get('z')||3),out=document.getElementById('out');out.innerHTML='';const shots=[];
  // (the lone spire at cell (38,9): yours behind it and in front; behind the massif yours and the enemy's)
  {const t=PX.groundFixture({recipe:'spires',C:60,R:38,seed:sd}),gr=PX.battleGround({...t,climate}),R3=gr.props.filter(p=>p.dk===3),men=[];
    const sec=(x0,x1,y0,y1)=>R3.filter(p=>p.x>=x0&&p.x<x1&&p.y>=y0&&p.y<y1),sp=sec(596,644,100,200),fy=Math.max(...sp.map(p=>p.y)),fx=Math.round((Math.min(...sp.map(p=>p.box[0]))+Math.max(...sp.map(p=>p.box[2])))/2);
    const ms=sec(180,420,100,400),top=Math.min(...ms.map(p=>p.box[1])),bot=Math.max(...ms.map(p=>p.y)),mx=Math.round((Math.min(...ms.map(p=>p.box[0]))+Math.max(...ms.map(p=>p.box[2])))/2);
    men.push({team:0,x:fx-4,y:fy-12},{team:0,x:fx+5,y:fy-16},{team:0,x:fx-10,y:fy+6},{team:0,x:fx+2,y:fy+9},{team:0,x:fx+12,y:fy+5});
    // (the massif: a line just behind its back, yours on the left half, the enemy's on the right)
    const back=x=>{let y0=1e9;for(const p of ms)if(x>=p.box[0]&&x<=p.box[2]){const yy=p.y-p.h+Math.round(p.h*.35);if(yy<y0)y0=yy}return y0};
    for(let k=0;k<8;k++){const x=mx-56+k*16;men.push({team:k<4?0:1,x,y:Math.min(back(x),bot-30)})}
    for(let k=0;k<4;k++)men.push({team:0,x:mx-30+k*18,y:bot+10});
    shots.push(['spire',gr,men,[fx-44,fy-70,88,96]],['massif',gr,men,[mx-90,Math.max(16,top-12),180,bot-top+34]])}
  {const t=PX.groundFixture({recipe:'plateau',C:60,R:38,seed:sd}),gr=PX.battleGround({...t,climate}),F2=gr.props.filter(p=>p.dk===2&&p.w>=12&&p.h>=11),f=F2.sort((a,b)=>b.y-a.y)[0],men=[];
    if(f){const top=f.y-f.h+1;men.push({team:0,x:f.x-6,y:top-3},{team:0,x:f.x+4,y:top-6},{team:1,x:f.x+40,y:top-3},{team:0,x:f.x-4,y:f.y+7},{team:0,x:f.x+8,y:f.y+10});
      shots.push(['cliff',gr,men,[f.x-48,top-36,128,f.h+60]])}}
  for(const [name,gr,men,r] of shots){const row=document.createElement('div');row.className='row';row.innerHTML='<span class="lab">'+name+' · '+climate+' · no fade | fade</span>';
    row.appendChild(crop(scene(gr,men,false),...r,Z));row.appendChild(crop(scene(gr,men,true),...r,Z));out.appendChild(row)}
}
// phase 4 cost: each field's painting (ms, mean of 3) and a frame's props (the fade's cover test over 150 of your men, as
// propsInView does, then every prop drawn: full zoom-out), over 300 frames
function renderBench(){const out=document.getElementById('out'),rows=[];
  for(const [recipe,climate] of [['spires','grass'],['spires','frost'],['mountriver','swamp'],['plateau','desert'],['cliffs','grass'],['hillwoods','grass'],['forest','grass']]){
    const t=PX.groundFixture({recipe,C:82,R:38,seed:1});let ms=0,gr;for(let k=0;k<3;k++){const t0=performance.now();gr=PX.battleGround({...t,climate});ms+=performance.now()-t0}ms/=3;
    const W=gr.width,H=gr.height,c=PX.canvas(W,H),g=c.getContext('2d'),R=PX.dice(PX.rng(5)),men=[];for(let k=0;k<150;k++)men.push({x:R.int(20,W-20),y:R.int(40,H-10)});
    const cc=8,gw=Math.ceil(W/cc)+1,gh=Math.ceil(H/cc)+1,PF=new Float32Array(gw*gh),L=gr.props;
    const frame=()=>{PF.fill(1e9);for(const u of men){const ga=Math.floor((u.y-15)/cc),gb=Math.floor((u.y-1)/cc),ha=Math.floor((u.x-5)/cc),hb=Math.floor((u.x+5)/cc);for(let y=ga;y<=gb;y++)for(let x=ha;x<=hb;x++){const i=y*gw+x;if(u.y<PF[i])PF[i]=u.y}}
      for(const p of L){const b=p.box;let cov=false;const ga=Math.max(0,Math.floor(b[1]/cc)),gb=Math.min(gh-1,Math.floor(b[3]/cc)),ha=Math.max(0,Math.floor(b[0]/cc)),hb=Math.min(gw-1,Math.floor(b[2]/cc));
        for(let y=ga;y<=gb&&!cov;y++){const o=y*gw;for(let x=ha;x<=hb;x++)if(PF[o+x]<p.y){cov=true;break}}p.al=cov?.4:1}
      for(const p of L){if(p.al<1)g.globalAlpha=p.al;g.drawImage(p.s,p.dx,p.dy);if(p.al<1)g.globalAlpha=1}};
    for(let k=0;k<20;k++)frame();g.getImageData(0,0,1,1);const t0=performance.now();for(let k=0;k<300;k++)frame();const f=(performance.now()-t0)/300;g.getImageData(0,0,1,1);const f2=(performance.now()-t0)/300;
    rows.push(recipe+' · '+climate+' 82×38: paint '+ms.toFixed(1)+' ms; props '+[1,2,3].map(k=>L.filter(p=>p.dk===k).length).join('/')+' (trees/faces/rock); a frame '+f.toFixed(3)+' ms JS ('+f2.toFixed(3)+' ms with the raster flush)')}
  out.innerHTML='<pre id="bench">'+rows.join('\n')+'</pre>'}
// the world map's nature (engine/worldnature.js): each climate's trees (every species, 4 shapes, and dim as deep in a wood), small
// things, hills (their bumps, shaded alone), peaks (16, 32 and 64 boxes), then a stand-in map a climate painted by PX.worldNature
// (a wood, hills, a range, a pond, a road kept clear). ?z= the sprites' zoom (3), &c= one climate, &seed=
function renderNature(){
  const q=new URLSearchParams(location.search),Z=+(q.get('z')||3),cl=q.get('c'),sd=+(q.get('seed')||1),out=document.getElementById('out');out.innerHTML='';
  document.querySelector('h1').textContent='PX world nature';document.querySelector('p').textContent='The world map’s trees, small things, hills and peaks by climate (engine/worldnature.js), and a stand-in map painted with them.';
  const GR={grass:'#547e3a',frost:'#d6dee8',desert:'#d6b668',swamp:'#485834'};
  const cell=(sp,bg,z,lab)=>{const N=sp.width,c=document.createElement('canvas'),M=2;c.width=(N+2*M)*z;c.height=(N+2*M)*z;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.scale(z,z);g.fillStyle=bg;g.fillRect(0,0,N+2*M,N+2*M);
    g.fillStyle='rgba(0,0,0,.12)';g.fillRect(M,M,N,1);g.fillRect(M,M+N-1,N,1);g.fillRect(M,M,1,N);g.fillRect(M+N-1,M,1,N);g.drawImage(sp,M,M);if(lab)c.title=lab;return c};
  const row=(lab,list)=>{const r=document.createElement('div');r.className='row';r.innerHTML='<span class="lab">'+lab+'</span>';list.forEach(c=>r.appendChild(c));out.appendChild(r)};
  for(const c of ['grass','frost','desert','swamp']){if(cl&&cl!==c)continue;const bg=GR[c];
    const sp=PX.WORLD_SPECIES[c];row(c+' · trees',sp.flatMap(s=>[0,1,2,3].map(v=>cell(PX.worldTree(c,s,v,0),bg,Z,s+' '+v))));
    row(c+' · deep in a wood',sp.flatMap(s=>[0,1,2,3].map(v=>cell(PX.worldTree(c,s,v,1),bg,Z,s+' '+v+' dim'))));
    row(c+' · small things',PX.WORLD_DECOR[c].concat(c==='swamp'?['pad']:c==='frost'?['floe']:[]).flatMap(k=>[0,1,2,3].map(v=>cell(PX.worldDecor(c,k,v),k==='pad'||k==='floe'?(c==='frost'?'#96b8d4':'#40584a'):bg,Z,k+' '+v))));
    row(c+' · hills',[0,1,2,3,4,5].map(v=>cell(PX.worldHill(c,v),bg,Z,'hill '+v)));
    row(c+' · peaks 16, 32',[0,1,2,3,4,5].map(v=>cell(PX.worldPeak(c,v,16),bg,Z,'16 '+v)).concat([0,1,2,3,4,5].map(v=>cell(PX.worldPeak(c,v,32),bg,Z,'32 '+v))));
    row(c+' · peaks 64',[0,1,2,3,4,5].map(v=>cell(PX.worldPeak(c,v,64),bg,Z,'64 '+v)))}
  for(const c of ['grass','frost','desert','swamp']){if(cl&&cl!==c)continue;const f=natureFixture(c,sd);row(c+' · a stand-in map · '+f.res.ms.toFixed(0)+' ms · trees '+f.res.trees+', hills '+f.res.hills+', peaks '+f.res.peaks+', small things '+(f.res.decor+f.res.flat),[(()=>{const z=+(q.get('mz')||2),c2=document.createElement('canvas');c2.width=f.cv.width*z;c2.height=f.cv.height*z;const g=c2.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(f.cv,0,0,c2.width,c2.height);return c2})()])}
}
// a stand-in map (C×R tiles, 0 open, 1 wood, 2 hill, 3 water, 4 road, 5 rock) on the climate's plain ground: blobs of wood, hills
// and a range, a pond, a road across it all (kept clear, its band painted)
function natureFixture(clim,seed){
  const C=40,R=24,ts=16,W=C*ts,H=R*ts,K=new Uint8Array(C*R),CI=new Uint8Array(C*R).fill(['grass','frost','desert','swamp'].indexOf(clim)),h=(x,y,k)=>PX.hash(x,y,seed*31+k);
  const blob=(cx,cy,rx,ry,k)=>{for(let y=0;y<R;y++)for(let x=0;x<C;x++)if(((x-cx)/rx)**2+((y-cy)/ry)**2<1-h(x,y,k)*.35)K[y*C+x]=k};
  blob(9,8,7,5,clim==='desert'?2:1);blob(27,6,8,4.5,5);blob(29,17,8,4,2);blob(10,19,4,2.6,3);if(clim==='desert')blob(5,5,2,1.5,3);
  let py=12;for(let x=0;x<C;x++){const y=12+Math.round(Math.sin(x/5)*1.5);for(let yy=Math.min(y,py);yy<=Math.max(y,py);yy++)if(K[yy*C+x]!==3&&K[yy*C+x]!==5)K[yy*C+x]=4;py=y}
  const cv=PX.canvas(W,H,g=>{const im=g.createImageData(W,H),D=im.data,B=PX.GROUND_PAL[clim].base.map(c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]),WA=PX.GROUND_PAL[clim].water.map(c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]);
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const k=K[(y>>4)*C+(x>>4)],v=PX.hash(x>>2,y>>2,seed)*.6+PX.hash(x,y,seed+1)*.4,c=k===3?WA[v<.5?1:2]:B[v<.3?0:v<.75?1:2],o=(y*W+x)*4;D[o]=c[0];D[o+1]=c[1];D[o+2]=c[2];D[o+3]=255}
    // (the road: a worn band from each road tile's middle to its road neighbours, and clear ground round it)
    const clear=new Uint8Array(W*H),band=(x0,y0,x1,y1)=>{for(let y=Math.max(0,y0-3);y<Math.min(H,y1+3);y++)for(let x=Math.max(0,x0-3);x<Math.min(W,x1+3);x++){clear[y*W+x]=1;if(x>=x0&&x<x1&&y>=y0&&y<y1){const o=(y*W+x)*4,e=x===x0||x===x1-1||y===y0||y===y1-1,c=e?[138,116,72]:[184,155,98];D[o]=c[0];D[o+1]=c[1];D[o+2]=c[2]}}};
    const rd=(x,y)=>x>=0&&y>=0&&x<C&&y<R&&K[y*C+x]===4;for(let ty=0;ty<R;ty++)for(let tx=0;tx<C;tx++)if(rd(tx,ty)){const cx=tx*ts+8,cy=ty*ts+8;band(cx-4,cy-4,cx+4,cy+4);
      if(rd(tx+1,ty))band(cx,cy-4,cx+16,cy+4);if(rd(tx,ty+1))band(cx-4,cy,cx+4,cy+16)}
    natureFixture.res=PX.worldNature({D,W,H,C,R,ts,kind:K,clim:CI,clear,seed});g.putImageData(im,0,0)});
  return{cv,res:natureFixture.res}}
// props and camps
// ?view=beasts: every beast and monster (engine/beasts.js) in its power-of-two cell beside a stand-in man for scale: standing and
// breathing, the walk, the run, the attack (and the dragon's breath), lying dead, its other variants, on your side, and on the map
function renderBeasts(){
  const q=new URLSearchParams(location.search),Z=+(q.get('z')||3),out=document.getElementById('out'),only=q.get('only');out.innerHTML='';
  const cellOf=s=>{const n=[8,16,32,64].find(k=>k>=s.width&&k>=s.height),c=PX.canvas(n,n);c.getContext('2d').drawImage(s,(n>>1)-(s.width>>1),n-s.height);return c};
  const man=PX.canvas(16,16,g=>{g.fillStyle='#1a1c26';g.fillRect(4,0,7,16);g.fillStyle='#b8b0a0';g.fillRect(5,1,5,4);g.fillStyle='#6a7a9a';g.fillRect(5,5,5,7);g.fillStyle='#5a4a3a';g.fillRect(5,12,2,3);g.fillRect(8,12,2,3)});
  const show=(row,s,lab)=>{const c=cellOf(s),cv=document.createElement('canvas');cv.width=c.width*Z;cv.height=c.height*Z;cv.title=lab;const g=cv.getContext('2d');g.imageSmoothingEnabled=false;g.fillStyle='#5a8a3a';g.fillRect(0,0,cv.width,cv.height);
    g.fillStyle='rgba(0,0,0,.25)';g.fillRect(0,(c.height-2)*Z,cv.width,1);g.fillRect((c.width>>1)*Z,0,1,cv.height);g.drawImage(c,0,0,cv.width,cv.height);row.appendChild(cv)};
  if(q.get('fit')){out.textContent=JSON.stringify([...PX.BEAST_KINDS,'drake'].map(PX._beastFit));return}
  for(const k of PX.BEAST_KINDS){if(only&&!only.split(',').includes(k))continue;const row=document.createElement('div');row.className='row';row.innerHTML='<span class="lab">'+k+'</span>';show(row,man,'a man');try{
    const poses=[0,1,2,3,4,5,15,16,17,18,6,7,8].concat(k==='dragon'?[9,10,11]:[]);for(const p of poses)show(row,PX.beast(k,{pose:p,v:+(q.get('v')||0),team:1}),'pose '+p);
    show(row,PX.beast(k,{pose:PX.BEAST_DEAD,team:1}),'dead');for(const v of [1,2])show(row,PX.beast(k,{v,team:1}),'variant '+v);show(row,PX.beast(k,{team:0}),'your side');
    for(const f of [0,1])show(row,PX.beastMap(k,f),'map '+f)}catch(e){row.insertAdjacentHTML('beforeend','<span class="lab" style="width:auto;color:#f88">'+e.message+' '+(e.stack||'').split(String.fromCharCode(10))[1]+'</span>')}out.appendChild(row)}
}
function renderProps(){
  const q=new URLSearchParams(location.search),Z=+(q.get('z')||3),out=document.getElementById('out');out.innerHTML='';
  const row=document.createElement('div');row.className='row';row.innerHTML='<span class="lab">props · 8px</span>';
  for(const type of PX.PROP_TYPES){const c=document.createElement('canvas'),w=16;c.width=w*Z*2;c.height=w*Z*2;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.scale(Z*2,Z*2);g.fillStyle='#5a8a3a';g.fillRect(0,0,w,w);
    g.fillStyle='rgba(0,0,0,.18)';g.fillRect(0,8,w,1);g.fillRect(8,0,1,w);const p=PX.prop({type});g.drawImage(p.img,4,4);row.appendChild(c)}
  out.appendChild(row);
  const r2=document.createElement('div');r2.className='row';r2.innerHTML='<span class="lab">camps</span>';
  for(const kind of ['bandit','hideout','travelers']){const c=kind==='bandit'?PX.camp({kind,seed:4}):PX.site({type:kind,seed:4}),cv=document.createElement('canvas');cv.width=c.w*Z;cv.height=c.h*Z;const g=cv.getContext('2d');g.imageSmoothingEnabled=false;g.scale(Z,Z);g.fillStyle='#5a8a3a';g.fillRect(0,0,c.w,c.h);g.drawImage(c.img,0,0);const fl=PX.flame(0);g.drawImage(fl.img,c.fire[0]-fl.ax,c.fire[1]-fl.ay);g.fillStyle='#4a3020';g.fillRect(c.flag[0],c.flag[1]-9,1,9);g.fillStyle='#c84040';g.fillRect(c.flag[0]+1,c.flag[1]-9,4,3);r2.appendChild(cv)}
  out.appendChild(r2);
}
const q=new URLSearchParams(location.search);if(q.get('z'))document.getElementById('z').value=q.get('z');if(q.get('n'))document.getElementById('n').value=q.get('n');if(q.get('only'))document.getElementById('only').value=q.get('only');
document.querySelectorAll('input').forEach(i=>i.addEventListener('input',render));render();
